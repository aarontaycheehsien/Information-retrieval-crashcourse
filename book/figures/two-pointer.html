<div class="svg-scroll"><svg width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="two-pointer-svg-title two-pointer-svg-desc" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto">
<title id="two-pointer-svg-title">Two-pointer intersection of posting lists</title>
<desc id="two-pointer-svg-desc">Four steps compare the ordered posting lists for delulu and interview. Matching D1 is retained, then the cursor on interview advances past D2, the cursor on delulu advances past D4, and matching D8 is retained.</desc>
<rect x="1" y="1" width="758" height="468" rx="14" fill="#fbf9f4" stroke="#d5d0c5"></rect>
<text x="28" y="35" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#596462">ORDERED POSTING LISTS</text>

<!-- list labels -->
<text x="28" y="82" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#6d3d88">delulu</text>
<text x="28" y="137" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#125e5a">interview</text>

<!-- posting nodes -->
<g font-family="Consolas, monospace" font-size="16" text-anchor="middle">
  <g fill="#eee2f4" stroke="#6d3d88">
    <rect x="145" y="55" width="62" height="42" rx="8"></rect><rect x="285" y="55" width="62" height="42" rx="8"></rect><rect x="425" y="55" width="62" height="42" rx="8"></rect>
  </g>
  <g fill="#d9ece8" stroke="#125e5a">
    <rect x="145" y="110" width="62" height="42" rx="8"></rect><rect x="215" y="110" width="62" height="42" rx="8"></rect><rect x="425" y="110" width="62" height="42" rx="8"></rect>
  </g>
  <g fill="#17201f">
    <text x="176" y="82">D1</text><text x="316" y="82">D4</text><text x="456" y="82">D8</text>
    <text x="176" y="137">D1</text><text x="246" y="137">D2</text><text x="456" y="137">D8</text>
  </g>
</g>

<!-- starting cursor positions -->
<polygon points="176,52 168,41 184,41" fill="#6d3d88"></polygon>
<text x="191" y="49" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6d3d88">cursor</text>
<polygon points="176,156 168,167 184,167" fill="#125e5a"></polygon>
<text x="191" y="169" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#125e5a">cursor</text>

<!-- sequence arrows between nodes -->
<g stroke="#8b8478" stroke-width="2">
  <line x1="207" y1="76" x2="285" y2="76"></line><line x1="347" y1="76" x2="425" y2="76"></line>
  <line x1="207" y1="131" x2="215" y2="131"></line><line x1="277" y1="131" x2="425" y2="131"></line>
</g>

<!-- four steps -->
<g font-family="Inter, Arial, sans-serif">
  <g transform="translate(28 188)">
    <circle cx="18" cy="18" r="18" fill="#17201f"></circle><text x="18" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="52" y="15" font-size="15" font-weight="700" fill="#17201f">D1 matches D1</text>
    <text x="52" y="37" font-size="14" fill="#596462">Keep D1 and advance both cursors.</text>
  </g>
  <g transform="translate(392 188)">
    <circle cx="18" cy="18" r="18" fill="#17201f"></circle><text x="18" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="52" y="15" font-size="15" font-weight="700" fill="#17201f">D4 is greater than D2</text>
    <text x="52" y="37" font-size="14" fill="#596462">Advance only the interview cursor.</text>
  </g>
  <g transform="translate(28 290)">
    <circle cx="18" cy="18" r="18" fill="#17201f"></circle><text x="18" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="52" y="15" font-size="15" font-weight="700" fill="#17201f">D4 is smaller than D8</text>
    <text x="52" y="37" font-size="14" fill="#596462">Advance only the delulu cursor.</text>
  </g>
  <g transform="translate(392 290)">
    <circle cx="18" cy="18" r="18" fill="#17201f"></circle><text x="18" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="52" y="15" font-size="15" font-weight="700" fill="#17201f">D8 matches D8</text>
    <text x="52" y="37" font-size="14" fill="#596462">Keep D8. The intersection is D1, D8.</text>
  </g>
</g>

<rect x="28" y="389" width="704" height="52" rx="9" fill="#dce9e5" stroke="#1d5b59"></rect>
<text x="380" y="411" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#173b39">Rule: advance the smaller identifier; never move backwards.</text>
<text x="380" y="431" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#385f5c">Each posting is examined at most once during this simple intersection.</text>
</svg></div>
