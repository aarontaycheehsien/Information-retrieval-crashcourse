<title id="shapes-of-the-blank-svg-title">One sentence, three training tasks</title>
<desc id="shapes-of-the-blank-svg-desc">The sentence “The patient received heart treatment after the attack” is shown three times, with a different part hidden in each. In the first row Word2Vec, in its CBOW arrangement, hides the word heart and recovers it from the neighbouring words on either side. In the second, masked language modelling hides the word treatment and recovers it from the words on both sides. In the third, next-token prediction hides everything from one position rightwards and recovers the next word from the left-hand words alone. The arrangement is the same in every row; only the position of the blank and the amount of visible text change.</desc>
