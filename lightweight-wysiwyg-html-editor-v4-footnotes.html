        const h2 = section.querySelector(":scope > .chapter-head h2, :scope > h2");
        return { section, kind, label, eyebrow, h2, title: outlineHeadingText(h2 || section) };
      }

      function makeTocRows(doc, infos) {
        const rows = [];
        for (const info of infos) {
          const { section, kind, h2 } = info;
          const sid = section.id;
          if (kind === "part") {
            if (!sid || !h2) continue;
            const tag = section.querySelector(":scope > .part-tag")?.textContent.trim() || "";
            const title = outlineHeadingText(h2);
            const shown = section.classList.contains("backmatter-divider") || !tag ? (tag || title) : `${tag} · ${title}`;
            const li = doc.createElement("li");
            li.className = "toc-part";
            const link = doc.createElement("a");
            link.href = `#${sid}`;
            link.textContent = shown;
            li.appendChild(link);
            rows.push(li);
            continue;
          }
          if (kind === "exercise") {
            if (!sid || !h2) continue;
            const li = doc.createElement("li");
            li.className = "toc-ex";
            const link = doc.createElement("a");
            link.href = `#${sid}`;
            link.textContent = outlineHeadingText(h2).split("—")[0].trim();
            li.appendChild(link);
            rows.push(li);
            continue;
          }
          if (!h2?.id) continue;

          const li = doc.createElement("li");
          li.className = "toc-ch";
          if (sid.startsWith("sec-")) li.dataset.ch = sid.slice(4);
          const link = doc.createElement("a");
          link.href = `#${h2.id}`;
          const eyebrowText = info.eyebrow?.textContent.trim() || "";
          if (eyebrowText) {
            const em = doc.createElement("em");
            em.textContent = eyebrowText;
            link.appendChild(em);
          }
          const title = doc.createElement("span");
          title.innerHTML = cleanHeadingHtml(h2);
          while (title.firstChild) link.appendChild(title.firstChild);
          li.appendChild(link);

          if (section.classList.contains("chapter") && !section.classList.contains("backsection")) {
            const subheadings = [...section.querySelectorAll("h3[id]")].filter(heading =>
              !heading.closest("figure, aside, details") && !heading.classList.contains("group-title")
            );
            if (subheadings.length) {
              const sublist = doc.createElement("ol");
              sublist.className = "toc-subs";
              for (const heading of subheadings) {
                const subitem = doc.createElement("li");
                subitem.className = "toc-sec";
                const sublink = doc.createElement("a");
                sublink.href = `#${heading.id}`;
                sublink.innerHTML = cleanHeadingHtml(heading);
                subitem.appendChild(sublink);
                sublist.appendChild(subitem);
              }
              li.appendChild(sublist);
            }
          }
          rows.push(li);
        }
        return rows;
      }

      function rebuildTextbookTocs(doc, infos) {
        const rows = makeTocRows(doc, infos);
        let rebuilt = 0;
        for (const id of ["toc-list", "mobile-toc-list"]) {
          const list = doc.getElementById(id);
          if (!list) continue;
          list.replaceChildren(...rows.map(row => row.cloneNode(true)));
          rebuilt += 1;
        }
        return rebuilt;
      }

      function allowedIndexHtml(source) {
        const wrapper = source.ownerDocument.createElement("span");
        wrapper.innerHTML = source.innerHTML;
        const allowed = new Set(["EM", "CODE", "SUB", "SUP", "STRONG"]);
        [...wrapper.querySelectorAll("*")].reverse().forEach(element => {
          if (!allowed.has(element.tagName)) element.replaceWith(...element.childNodes);
        });
        return wrapper.innerHTML.replace(/\s+/g, " ").trim();
      }

      function firstSentence(value) {
        const text = String(value || "").replace(/\s+/g, " ").trim();
        const match = text.match(/^(.{25,}?[.?!])\s+[A-Z(]/);
        return match ? match[1] : text;
      }

      function rebuildAssetIndexes(doc, problems) {
        const figures = [];
        for (const figure of doc.querySelectorAll("figure")) {
          const label = figure.querySelector("figcaption .asset-label-inline[id]");
          const title = figure.querySelector(":scope > .figure-title");
          if (!label) {
            problems.push(`Figure has no numbered label near “${outlineHeadingText(figure).slice(0, 60)}”.`);
            continue;
          }
          if (!title) {
            problems.push(`${label.textContent.trim()} has no direct .figure-title.`);
            continue;
          }
          figures.push({ id: label.id, number: label.textContent.trim(), html: allowedIndexHtml(title) });
        }

        const tables = [];
        for (const label of doc.querySelectorAll("p.asset-label[id]")) {
          const match = label.textContent.trim().match(/^(Table\s+[0-9A-Za-z]+\.\d+)\s*—\s*(.*)$/s);
          if (!match) {
            problems.push(`Table label has no caption text: “${label.textContent.trim()}”.`);
            continue;
          }
          tables.push({ id: label.id, number: match[1], html: escapeHtml(firstSentence(match[2])) });
        }

        function fill(id, entries) {
          const list = doc.getElementById(id);
          if (!list) {
            problems.push(`No #${id} list is available for the asset index.`);
            return;
          }
          list.replaceChildren();
          for (const entry of entries) {
            const li = doc.createElement("li");
            const link = doc.createElement("a");
            link.href = `#${entry.id}`;
            link.textContent = entry.number;
            const span = doc.createElement("span");
            span.innerHTML = entry.html;
            li.append(link, span);
            list.appendChild(li);
          }
        }

        fill("figure-index", figures);
        fill("table-index", tables);
        return { figures: figures.length, tables: tables.length };
      }

      function staleTextbookCrossReferences(doc, infos) {
        const problems = [];
        const owners = new Map();
        for (const info of infos) {
          if (!["chapter", "appendix"].includes(info.kind) || !/^\d+$|^[A-Z]$/.test(info.label || "")) continue;
          [info.section, ...info.section.querySelectorAll("[id]")]
            .forEach(element => owners.set(element.id, info.label));
        }
        const titles = new Map(
          [...doc.querySelectorAll("h2[id], h3[id], h4[id]")]
            .map(heading => [heading.id, outlineHeadingText(heading)])
        );

        for (const link of doc.querySelectorAll("a[href^='#']")) {
          const target = safeDecode((link.getAttribute("href") || "").slice(1));
          const text = link.textContent.replace(/\s+/g, " ").trim();
          const asset = target.match(/^(fig|tbl)-([0-9a-z]+)-(\d+)$/);
          if (asset) {
            const said = text.match(/^(Figure|Table)\s+([0-9A-Z]+)\.(\d+)$/);
            if (said) {
              const wanted = [asset[1] === "fig" ? "Figure" : "Table", asset[2].toUpperCase(), asset[3]];
              if (said[1] !== wanted[0] || said[2] !== wanted[1] || said[3] !== wanted[2]) {
                problems.push(`#${target} is ${wanted[0]} ${wanted[1]}.${wanted[2]} but a link calls it “${text}”.`);
              }
            }
            continue;
          }

          const owner = owners.get(target);
          if (!owner || text === titles.get(target)) continue;
          const named = new Set();
          for (const match of text.matchAll(/Chapters?\s+(\d+(?:\s*(?:,|–|—|-|&|and|to)\s*\d+)*)/g)) {
            match[1].match(/\d+/g)?.forEach(value => named.add(value));
          }
          for (const match of text.matchAll(/Appendi(?:x|ces)\s+([A-Z])(?![a-z])/g)) named.add(match[1]);
          if (/^\d+$/.test(text)) named.add(text);
          if (named.size && !named.has(owner)) {
            problems.push(`#${target} is in ${owner} but a link calls it “${text.slice(0, 60)}”.`);
          }
        }
        return [...new Set(problems)].sort();
      }

      function maintainTextbookDocument(doc) {
        const before = doc.documentElement.outerHTML;
        const problems = [];
        const changes = [];
        const sections = textbookSections(doc);
        let appendixIndex = 0;
        const infos = sections.map(section => {
          const info = sectionMaintenanceInfo(section, appendixIndex);
          if (info.kind === "appendix") appendixIndex += 1;
          return info;
        });

        for (const info of infos) {
          if (info.kind === "appendix" && info.eyebrow) {
            const wanted = `Appendix ${info.label}`;
            if (info.eyebrow.textContent.trim() !== wanted) {
              info.eyebrow.textContent = wanted;
              changes.push(`Updated ${wanted} lettering`);
            }
          }
          if (info.label === "?") {
            problems.push(`Chapter ${info.section.id || "(without id)"} has an unrecognised eyebrow.`);
            continue;
          }
          if (info.label === null) continue;

          const tableLabels = [...info.section.querySelectorAll("p.asset-label")];
          const tables = [...info.section.querySelectorAll(".table-wrap > table")];
          tableLabels.forEach((label, index) => {
            const number = index + 1;
            const wantedId = `tbl-${info.label.toLowerCase()}-${number}`;
            replaceLeadingText(label, /^Table\s+[0-9A-Za-z]+\.\d+/, `Table ${info.label}.${number}`);
            label.id = wantedId;
          });
          if (tables.length !== tableLabels.length) {
            problems.push(`${info.title}: ${tables.length} table(s) but ${tableLabels.length} numbered label(s).`);
          }

          const figures = [...info.section.querySelectorAll("figure > figcaption")];
          const figureLabels = figures.map(caption => caption.querySelector(".asset-label-inline")).filter(Boolean);
          figureLabels.forEach((label, index) => {
            const number = index + 1;
            const wantedId = `fig-${info.label.toLowerCase()}-${number}`;
            replaceLeadingText(label, /^Figure\s+[0-9A-Za-z]+\.\d+/, `Figure ${info.label}.${number}`);
            label.id = wantedId;
          });
          if (figures.length !== figureLabels.length) {
            problems.push(`${info.title}: ${figures.length} figure caption(s) but ${figureLabels.length} numbered label(s).`);
          }
        }

        const tocCount = rebuildTextbookTocs(doc, infos);
        if (tocCount) changes.push(`Rebuilt ${tocCount} table-of-contents lists`);
        const assets = rebuildAssetIndexes(doc, problems);
        changes.push(`Rebuilt indexes for ${assets.figures} figures and ${assets.tables} tables`);

        const footnoteRanks = renumberFootnotesInDocument(doc);
        if (doc.querySelectorAll("a.footnote-ref").length && !footnoteRanks.size) {
          problems.push("Footnotes could not be renumbered because references or notes are duplicated or incomplete.");
        } else if (footnoteRanks.size) {
          changes.push(`Renumbered ${footnoteRanks.size} footnotes`);
        }

        problems.push(...staleTextbookCrossReferences(doc, infos));
        const changed = before !== doc.documentElement.outerHTML;
        return { changed, changes: [...new Set(changes)], problems: [...new Set(problems)] };
      }

      function mergeMaintenanceProblems(report, maintenance) {
        for (const message of maintenance?.problems || []) {
          const rendered = `Textbook maintenance: ${message}`;
          report.errors.push(rendered);
          report.issues.push({ severity: "error", message: rendered, targetId: "" });
        }
        return report;
      }

      function maintainCurrentTextbook({ announce = true } = {}) {
        let doc;
        if (currentMode === "source") {
          doc = new DOMParser().parseFromString(sourceEditor.value, "text/html");
        } else {
          doc = editorDocument();
        }
        if (!isTextbookDocument(doc)) {
          const result = { changed: false, changes: [], problems: ["This document does not match the textbook structure."] };
          if (announce) setStatus(result.problems[0], true);
          return result;
        }

        const result = maintainTextbookDocument(doc);
        if (currentMode === "source") {
          const html = `${storedDoctype}\n${doc.documentElement.outerHTML}`;
          if (result.changed) sourceEditor.value = html;
        } else {
          lockMachineOwnedSections(doc);
          refreshOutline(doc);
        }
        if (result.changed) {
          markDirty();
          if (currentMode === "visual") commitVisualHistory(doc);
        }
        updateCount();

        if (announce) {
          const report = mergeMaintenanceProblems(checkDocumentIntegrity(currentHtml()), result);
          renderDiagnostics(report);
          setStatus(
            result.problems.length
              ? `Textbook maintenance completed with ${result.problems.length} problem${result.problems.length === 1 ? "" : "s"}.`
              : `Textbook maintenance complete: ${result.changes.join("; ")}.`,
            Boolean(result.problems.length)
          );
        }
        return result;
      }

      function slugifyId(value, fallback = "section") {
        const slug = String(value || "")
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/&/g, " and ")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
        return slug || fallback;
      }

      function uniqueDocumentId(doc, suggested) {
        const base = slugifyId(suggested);
        let candidate = base;
        let suffix = 2;
        while (doc.getElementById(candidate)) candidate = `${base}-${suffix++}`;
        return candidate;
      }

      function structureField(name) {
        return structureForm.elements.namedItem(name);
      }

      function openStructureDialog(type) {
        if (currentMode !== "visual" || !textbookMode) return;
        const configurations = {
          heading: {
            title: "Insert heading",
            help: "Headings receive stable link targets and are added to the generated contents when appropriate.",
            fields: `
              <label class="full">Heading text<input name="title" required autocomplete="off"></label>
              <label>Level<select name="level"><option value="h3">Section (H3)</option><option value="h4">Subsection (H4)</option></select></label>
              <label>Link ID<input name="id" placeholder="generated-from-heading" pattern="[A-Za-z][A-Za-z0-9._:-]*"></label>`
          },
          figure: {
            title: "Insert figure",
            help: "The figure number and index entry are generated by Textbook maintenance.",
            fields: `
              <label class="full">Figure title<input name="title" required autocomplete="off"></label>
              <label class="full">Image path<input name="src" required placeholder="images/example.png" autocomplete="off"></label>
              <label class="full">Alternative text<textarea name="alt" required rows="2"></textarea></label>
              <label class="full">Caption<textarea name="caption" required rows="3"></textarea></label>`
          },
          table: {
            title: "Insert table",
            help: "Separate cells with | or Tab, and put each body row on a new line. Numbering and the table index are generated automatically.",
            fields: `
              <label class="full">Caption<input name="caption" required autocomplete="off"></label>
              <label class="full">Column headings<textarea name="headers" required rows="2" placeholder="Column 1 | Column 2"></textarea></label>
              <label class="full">Body rows<textarea name="rows" required rows="5" placeholder="Value 1 | Value 2&#10;Value 3 | Value 4"></textarea></label>`
          },
          callout: {
            title: "Insert callout",
            help: "Callouts use the textbook’s established question, practice and common-confusion patterns.",
            fields: `
              <label>Type<select name="kind"><option value="question">Reasonable question</option><option value="practice">Practice</option><option value="common-confusion">Common confusion</option></select></label>
              <label>Label<input name="label" value="Reasonable question" required></label>
              <label class="full">Title<input name="title" required autocomplete="off"></label>
              <label class="full">Body<textarea name="body" required rows="6" placeholder="Plain text paragraphs or simple HTML"></textarea></label>`
          },
          "self-check": {
            title: "Add self-check question",
            help: "The question is added to the nearest chapter’s Check yourself section; one is created if necessary.",
            fields: `
              <label class="full">Question<textarea name="question" required rows="3"></textarea></label>
              <label class="full">Answer<textarea name="answer" required rows="5" placeholder="Plain text paragraphs or simple HTML"></textarea></label>`
          }
        };
        const configuration = configurations[type];
        if (!configuration) return;
        activeStructureType = type;
        structureDialogTitle.textContent = configuration.title;
        structureFields.innerHTML = configuration.fields;
        structureHelp.textContent = configuration.help;
        structureDialog.showModal();
        structureFields.querySelector("input, select, textarea")?.focus();

        if (type === "callout") {
          structureField("kind").addEventListener("change", event => {
            const labels = {
              question: "Reasonable question",
              practice: "Practice",
              "common-confusion": "Common confusion"
            };
            structureField("label").value = labels[event.target.value];
          });
        }
      }

      function blockInsertionRange(doc, originalRange) {
        const range = originalRange?.cloneRange() || doc.createRange();
        if (!originalRange) {
          range.selectNodeContents(doc.body);
          range.collapse(false);
          return range;
        }
        const anchor = elementForNode(range.endContainer);
        if (anchor?.closest("[data-lw-editor-lock]")) return null;
        const block = anchor?.closest(
          "p, h1, h2, h3, h4, h5, h6, ul, ol, pre, blockquote, figure, .table-wrap, aside, details"
        );
        if (block && doc.body.contains(block)) {
          range.selectNode(block);
          range.collapse(false);
        } else {
          range.collapse(false);
        }
        return range;
      }

      function insertStructuredNodes(doc, range, nodes) {
        const fragment = doc.createDocumentFragment();
        nodes.forEach(node => fragment.appendChild(node));
        const last = nodes[nodes.length - 1];
        range.insertNode(fragment);
        const after = doc.createRange();
        after.setStartAfter(last);
        after.collapse(true);
        restoreVisualRange(doc, after);
      }

      function appendSanitisedBody(target, rawValue) {
        const wrapper = sanitiseFootnoteFragment(target.ownerDocument, rawValue);
        target.append(...wrapper.childNodes);
      }

      function tableCells(value) {
        return String(value || "").split(/[|\t]/).map(cell => cell.trim());
      }

      function submitStructure(event) {
        event.preventDefault();
        if (!structureForm.reportValidity()) return;
        const doc = editorDocument();
        commitVisualHistory(doc);
        const originalRange = getSavedVisualRange(doc);
        const anchor = elementForNode(originalRange?.startContainer);
        const sectionContext = anchor?.closest("article#article > section");
        const context = anchor?.closest("section.chapter, section.appendix");
        if (activeStructureType !== "self-check" && !sectionContext) {
          setStatus("Place the cursor in the textbook section where this structure should be inserted.", true);
          return;
        }
        let range = blockInsertionRange(doc, originalRange);
        if (!range && activeStructureType !== "self-check") {
          setStatus("Place the cursor in editable textbook content, outside generated contents and indexes.", true);
          structureDialog.close();
          return;
        }

        const nodes = [];
        if (activeStructureType === "heading") {
          const title = structureField("title").value.trim();
          const level = structureField("level").value === "h4" ? "h4" : "h3";
          const heading = doc.createElement(level);
          heading.id = uniqueDocumentId(doc, structureField("id").value.trim() || title);
          heading.append(title);
          if (level === "h3") {
            const anchor = doc.createElement("a");
            anchor.className = "heading-anchor";
            anchor.href = `#${heading.id}`;
            anchor.setAttribute("aria-label", `Link to ${title}`);
            anchor.textContent = "#";
            heading.append(" ", anchor);
          }
          nodes.push(heading);
        } else if (activeStructureType === "figure") {
          const title = structureField("title").value.trim();
          const src = normaliseLinkTarget(structureField("src").value);
          if (!src) {
            setStatus("Use a safe relative image path or web URL.", true);
            return;
          }
          const figure = doc.createElement("figure");
          figure.className = "ir-figure";
          const titleElement = doc.createElement("p");
          titleElement.className = "figure-title";
          titleElement.id = uniqueDocumentId(doc, `figure-${title}-title`);
          titleElement.textContent = title;
          figure.setAttribute("aria-labelledby", titleElement.id);
          const image = doc.createElement("img");
          image.setAttribute("src", src);
          image.alt = structureField("alt").value.trim();
          const caption = doc.createElement("figcaption");
          const label = doc.createElement("span");
          label.className = "asset-label-inline";
          label.textContent = "Figure 0.0";
          caption.append(label, ` ${structureField("caption").value.trim()}`);
          figure.append(titleElement, image, caption);
          nodes.push(figure);
        } else if (activeStructureType === "table") {
          const headers = tableCells(structureField("headers").value);
          const rows = structureField("rows").value.split(/\r?\n/).filter(row => row.trim()).map(tableCells);
          if (!headers.length || rows.some(row => row.length !== headers.length)) {
            setStatus(`Every table row must contain exactly ${headers.length} cell${headers.length === 1 ? "" : "s"}.`, true);
            return;
          }
          const label = doc.createElement("p");
          label.className = "asset-label";
          label.textContent = `Table 0.0 — ${structureField("caption").value.trim()}`;
          const wrap = doc.createElement("div");
          wrap.className = "table-wrap";
          const table = doc.createElement("table");
          const thead = doc.createElement("thead");
          const headerRow = doc.createElement("tr");
          headers.forEach(value => {
            const th = doc.createElement("th");
            th.scope = "col";
            th.textContent = value;
            headerRow.appendChild(th);
          });
          thead.appendChild(headerRow);
          const tbody = doc.createElement("tbody");
          rows.forEach(values => {
            const row = doc.createElement("tr");
            values.forEach(value => {
              const cell = doc.createElement("td");
              cell.textContent = value;
              row.appendChild(cell);
            });
            tbody.appendChild(row);
          });
          table.append(thead, tbody);
          wrap.appendChild(table);
          nodes.push(label, wrap);
        } else if (activeStructureType === "callout") {
          const kind = structureField("kind").value;
          const classNames = {
            question: ["question-callout", "question-callout-label"],
            practice: ["practice-callout", "practice-callout-label"],
            "common-confusion": ["common-confusion", "common-confusion-label"]
          };
          const [asideClass, labelClass] = classNames[kind] || classNames.question;
          const aside = doc.createElement("aside");
          aside.className = asideClass;
          const title = structureField("title").value.trim();
          const heading = doc.createElement("h4");
          heading.id = uniqueDocumentId(doc, title);
          heading.textContent = title;
          aside.setAttribute("aria-labelledby", heading.id);
          const label = doc.createElement("p");
          label.className = labelClass;
          label.textContent = structureField("label").value.trim();
          aside.append(label, heading);
          appendSanitisedBody(aside, structureField("body").value);
          nodes.push(aside);
        } else if (activeStructureType === "self-check") {
          const chapter = context;
          if (!chapter) {
            setStatus("Place the cursor in the chapter or appendix that should receive this question.", true);
            return;
          }
          let selfCheck = chapter.querySelector(":scope > section.self-check");
          if (!selfCheck) {
            selfCheck = doc.createElement("section");
            selfCheck.className = "self-check";
            selfCheck.setAttribute("aria-label", "Questions on this chapter");
            const label = doc.createElement("p");
            label.className = "self-check-label";
            label.textContent = "Check yourself";
            selfCheck.appendChild(label);
            const navigation = chapter.querySelector(":scope > .chapter-nav");
            chapter.insertBefore(selfCheck, navigation || null);
          }
          const details = doc.createElement("details");
          details.className = "self-check-q";
          const summary = doc.createElement("summary");
          summary.textContent = structureField("question").value.trim();
          details.appendChild(summary);
          appendSanitisedBody(details, structureField("answer").value);
          selfCheck.appendChild(details);
          nodes.push(details);
          range = null;
        }

        if (range && nodes.length) insertStructuredNodes(doc, range, nodes);
        structureDialog.close();
        const maintenance = maintainCurrentTextbook({ announce: false });
        markDirty();
        scheduleCountUpdate();
        scheduleOutlineRefresh();
        commitVisualHistory(doc);
        setStatus(
          maintenance.problems.length
            ? `Inserted ${activeStructureType}; maintenance found ${maintenance.problems.length} problem${maintenance.problems.length === 1 ? "" : "s"}.`
            : `Inserted ${activeStructureType} and refreshed textbook numbering and indexes.`,
          Boolean(maintenance.problems.length)
        );
      }

      function insertHTML(html) {
        const doc = editorDocument();
        let range = editableVisualRange(doc);
        if (!range) {
          setStatus("Place the cursor in editable document content first.", true);
          return;
        }
        commitVisualHistory(doc);
        const fragment = range.createContextualFragment(html);
        const inserted = [...fragment.childNodes];
        if (!inserted.length) return;
        if (inserted.some(node => node.nodeType === 1 && node.tagName === "HR")) {
          range = blockInsertionRange(doc, range) || range;
        }
        range.deleteContents();
        range.insertNode(fragment);
        const caret = doc.createRange();
        caret.setStartAfter(inserted[inserted.length - 1]);
        caret.collapse(true);
        restoreVisualRange(doc, caret);
        finishFormattingMutation(doc, "Inserted content.");
      }


      function getSavedVisualRange(doc) {
        const selection = doc.getSelection();
        if (selection?.rangeCount) {
          const current = selection.getRangeAt(0);
          if (doc.body?.contains(current.commonAncestorContainer)) {
            return current.cloneRange();
          }
        }

        if (
          savedVisualRange &&
          savedVisualRange.startContainer?.ownerDocument === doc &&
          doc.body?.contains(savedVisualRange.commonAncestorContainer)
        ) {
          return savedVisualRange.cloneRange();
        }

        return null;
      }

      function restoreVisualRange(doc, range, collapseToEnd = false) {
        const selection = doc.getSelection();
        if (!selection || !range) return null;
        const restored = range.cloneRange();
        if (collapseToEnd) restored.collapse(false);
        selection.removeAllRanges();
        selection.addRange(restored);
        savedVisualRange = restored.cloneRange();
        visualEditor.contentWindow.focus();
        return restored;
      }

      function normaliseLinkTarget(value) {
        let target = String(value || "").trim();
        if (/^www\./i.test(target)) target = `https://${target}`;
        if (/^(?:javascript|vbscript|data):/i.test(target)) return "";
        return target;
      }

      function insertLink() {
        if (currentMode !== "visual") return;
        const doc = editorDocument();
        const originalRange = getSavedVisualRange(doc);
        if (!originalRange) {
          setStatus("Select text, or place the cursor where the link should be inserted.", true);
          return;
        }

        const entered = prompt(
          "Enter a full external URL (https://…) or an internal target (#section-id):",
          "https://"
        );
        if (entered === null) return;
        const target = normaliseLinkTarget(entered);
        if (!target || target === "https://" || target === "http://") {
          setStatus("Enter a valid link. Script and data URLs are not allowed.", true);
          return;
        }

        if (target.startsWith("#")) {
          const id = safeDecode(target.slice(1));
          if (!id || !doc.getElementById(id)) {
            setStatus(`Internal target ${target} does not exist. Add its id in Source mode first.`, true);
            return;
          }
        }

        restoreVisualRange(doc, originalRange);
        const range = editableVisualRange(doc);
        if (!range) {
          setStatus("The link insertion point was lost. Select the text and try again.", true);
          return;
        }

        let label = "";
        if (range.collapsed) {
          const existing = elementForNode(range.startContainer)?.closest("a");
          if (!existing) {
            const enteredLabel = prompt("Visible link text:", target.startsWith("#") ? target.slice(1) : target);
            if (enteredLabel === null || !enteredLabel.trim()) return;
            label = enteredLabel.trim();
          }
        }

        runRangeMutation((document, markers) => {
          if (markers.collapsed) {
            const existing = markers.start.parentElement?.closest("a");
            if (existing) {
              existing.setAttribute("href", target);
              return;
            }
            const link = document.createElement("a");
            link.href = target;
            link.textContent = label;
            markers.start.before(link);
            return;
          }
          const startBlock = closestFormattingBlock(markers.start);
          const endBlock = closestFormattingBlock(markers.end);
          if (!startBlock || startBlock !== endBlock) {
            throw new Error("Create a link within one paragraph or heading at a time.");
          }
          const selected = rangeBetweenMarkers(document, markers);
          const fragment = selected.extractContents();
          fragment.querySelectorAll("a").forEach(unwrapElement);
          const link = document.createElement("a");
          link.href = target;
          link.appendChild(fragment);
          selected.insertNode(link);
        }, `Inserted link to ${target}.`);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function slugifyFootnote(value) {
        return String(value || "")
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/&/g, " and ")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 48) || "note";
      }

      function uniqueFootnoteSlug(doc, base) {
        let slug = base;
        let suffix = 2;
        while (doc.getElementById(`fn:${slug}`) || doc.getElementById(`fnref:${slug}`)) {
          slug = `${base}-${suffix}`;
          suffix += 1;
        }
        return slug;
      }

      function nextFootnoteNumber(doc, list) {
        const referenceNumbers = [...doc.querySelectorAll("a.footnote-ref, .footnote-ref a")]
          .map(link => Number.parseInt(link.textContent, 10))
          .filter(Number.isFinite);
        const listCount = [...list.children].filter(child => child.tagName === "LI").length;
        return Math.max(listCount, 0, ...referenceNumbers) + 1;
      }

      function renumberFootnotesInDocument(doc) {
        const references = [...doc.querySelectorAll("a.footnote-ref")]
          .map(link => {
            const href = link.getAttribute("href") || "";
            const key = href.startsWith("#fn:") ? href.slice(4) : "";
            return { link, key, sup: link.closest("sup") };
          })
          .filter(item => item.key && item.sup);

        const keys = references.map(item => item.key);
        if (new Set(keys).size !== keys.length) return new Map();

        const section = doc.querySelector("section.footnotes");
        const list = section?.querySelector("ol");
        if (!list) return new Map();

        const notes = new Map(
          [...list.children]
            .filter(item => item.tagName === "LI" && item.id.startsWith("fn:"))
            .map(item => [item.id.slice(3), item])
        );
        if (keys.some(key => !notes.has(key))) return new Map();

        const ranks = new Map();
        references.forEach(({ link, key, sup }, index) => {
          const number = index + 1;
          ranks.set(key, number);
          link.textContent = String(number);
          link.setAttribute("href", `#fn:${key}`);
          sup.id = `fnref:${key}`;

          const note = notes.get(key);
          const backref = note.querySelector("a.footnote-backref, a.footnote");
          if (backref) {
            backref.setAttribute("href", `#fnref:${key}`);
            backref.title = `Jump back to footnote ${number} in the text`;
          }
          list.appendChild(note);
        });

        return ranks;
      }

      function ensureFootnoteStyles(doc) {
        if (doc.getElementById("lw-footnote-editor-styles")) return;
        const existingCss = [...doc.querySelectorAll("style")]
          .map(style => style.textContent || "")
          .join("\n");
        if (/a\.footnote-ref\b/.test(existingCss) && /\.footnotes\b/.test(existingCss)) return;
        const style = doc.createElement("style");
        style.id = "lw-footnote-editor-styles";
        style.textContent = `
          a.footnote-ref, .footnote-ref a {
            text-decoration: none;
            font: 700 .72rem/1 var(--sans, system-ui, sans-serif);
            background: var(--gold-soft, #eee3c8);
            border-radius: 999px;
            min-width: 1.35rem;
            height: 1.35rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: .12rem;
          }
          .footnotes {
            margin-top: 4rem;
            padding-top: 1rem;
            border-top: 1px solid var(--line, #d5d0c5);
            color: #45504e;
            font-size: .9rem;
          }
          .footnotes ol { padding-left: 1.4rem; }
          .footnotes li { margin: 1rem 0; }
          .footnotes a.footnote-backref,
          .footnotes .footnote {
            margin-left: .3rem;
            text-decoration: none;
          }
        `;
        (doc.head || doc.documentElement).appendChild(style);
      }

      function sanitiseFootnoteFragment(doc, rawValue) {
        const trimmed = String(rawValue || "").trim();
        const wrapper = doc.createElement("div");
        const containsHtml = /<\/?[a-z][^>]*>/i.test(trimmed);

        if (containsHtml) {
          wrapper.innerHTML = trimmed;
          wrapper.querySelectorAll("script, iframe, object, embed, style, link, meta, base").forEach(node => node.remove());
          wrapper.querySelectorAll("*").forEach(element => {
            for (const attribute of [...element.attributes]) {
              if (/^on/i.test(attribute.name)) element.removeAttribute(attribute.name);
              if (
                /^(href|src|xlink:href)$/i.test(attribute.name) &&
                /^\s*javascript:/i.test(attribute.value)
              ) {
                element.removeAttribute(attribute.name);
              }
            }
          });
        } else {
          const paragraphs = trimmed.split(/\n\s*\n/);
          for (const paragraphText of paragraphs) {
            const paragraph = doc.createElement("p");
            paragraph.innerHTML = escapeHtml(paragraphText).replace(/\n/g, "<br>");
            wrapper.appendChild(paragraph);
          }
        }

        const hasBlock = [...wrapper.children].some(element =>
          /^(P|DIV|BLOCKQUOTE|PRE|UL|OL|TABLE|FIGURE)$/i.test(element.tagName)
        );
        if (!hasBlock) {
          const paragraph = doc.createElement("p");
          while (wrapper.firstChild) paragraph.appendChild(wrapper.firstChild);
          wrapper.appendChild(paragraph);
        }

        return wrapper;
      }

      function footnoteSectionForRange(doc, range) {
        let section = doc.querySelector("section.footnotes");
        if (section) {
          let list = section.querySelector("ol");
          if (!list) {
            list = doc.createElement("ol");
            section.appendChild(list);
          }
          return { section, list };
        }

        section = doc.createElement("section");
        section.className = "footnotes";
        section.appendChild(doc.createElement("hr"));
        const list = doc.createElement("ol");
        section.appendChild(list);

        const anchorElement = range.commonAncestorContainer.nodeType === Node.ELEMENT_NODE
          ? range.commonAncestorContainer
          : range.commonAncestorContainer.parentElement;
        const container = anchorElement?.closest("article") ||
          doc.querySelector("article#article") ||
          doc.querySelector("article") ||
          doc.querySelector("main") ||
          doc.body;
        container.appendChild(section);
        return { section, list };
      }

      function insertFootnote() {
        if (currentMode !== "visual") return;
        const doc = editorDocument();
        const originalRange = getSavedVisualRange(doc);

        if (!originalRange) {
          setStatus("Place the cursor after the sentence or phrase that needs a footnote.", true);
          return;
        }

        const anchorElement = originalRange.commonAncestorContainer.nodeType === Node.ELEMENT_NODE
          ? originalRange.commonAncestorContainer
          : originalRange.commonAncestorContainer.parentElement;
        if (anchorElement?.closest("section.footnotes")) {
          setStatus("Place the cursor in the main text, not inside the footnotes section.", true);
          return;
        }

        const rawText = prompt(
          "Enter the footnote text. Basic HTML such as <strong>, <em> and <a href=\"…\"> is allowed:",
          ""
        );
        if (rawText === null || !rawText.trim()) return;

        commitVisualHistory(doc);
        ensureFootnoteStyles(doc);
        const { list } = footnoteSectionForRange(doc, originalRange);
        const number = nextFootnoteNumber(doc, list);
        const content = sanitiseFootnoteFragment(doc, rawText);
        const plainText = content.textContent.trim();
        const slug = uniqueFootnoteSlug(doc, slugifyFootnote(plainText || `note-${number}`));

        const item = doc.createElement("li");
        item.id = `fn:${slug}`;
        while (content.firstChild) item.appendChild(content.firstChild);

        let finalParagraph = [...item.querySelectorAll("p")].pop();
        if (!finalParagraph) {
          finalParagraph = doc.createElement("p");
          while (item.firstChild) finalParagraph.appendChild(item.firstChild);
          item.appendChild(finalParagraph);
        }

        finalParagraph.appendChild(doc.createTextNode("\u00a0"));
        const backref = doc.createElement("a");
        backref.className = "footnote-backref";
        backref.href = `#fnref:${slug}`;
        backref.title = `Jump back to footnote ${number} in the text`;
        backref.textContent = "↩";
        finalParagraph.appendChild(backref);
        list.appendChild(item);

        const range = restoreVisualRange(doc, originalRange, true);
        if (!range) {
          item.remove();
          setStatus("The insertion point was lost. Place the cursor and try again.", true);
          return;
        }

        const sup = doc.createElement("sup");
        sup.id = `fnref:${slug}`;
        const reference = doc.createElement("a");
        reference.className = "footnote-ref";
        reference.href = `#fn:${slug}`;
        reference.textContent = String(number);
        sup.appendChild(reference);
        range.insertNode(sup);
        range.setStartAfter(sup);
        range.collapse(true);
        restoreVisualRange(doc, range);

        const ranks = renumberFootnotesInDocument(doc);
        const finalNumber = ranks.get(slug) || number;

        markDirty();
        scheduleCountUpdate();
        commitVisualHistory(doc);
        setStatus(`Inserted footnote ${finalNumber}; all footnotes are now in document order.`);
      }

      function currentHtml({ renumberVisualFootnotes = false } = {}) {
        if (currentMode === "source") return sourceEditor.value;
        if (renumberVisualFootnotes) renumberFootnotesInDocument(editorDocument());
        return visualHTML();
      }

      function previewInstrumentation(token) {
        const encodedToken = JSON.stringify(token);
        return `<script>
          (() => {
            "use strict";
            const token = ${encodedToken};
            const selectorFor = element => {
              if (element.id) return "#" + CSS.escape(element.id);
              const classes = [...element.classList].slice(0, 2).map(value => "." + CSS.escape(value)).join("");
              return element.tagName.toLowerCase() + classes;
            };
            const report = stage => {
              const root = document.documentElement;
              const viewportWidth = root.clientWidth;
              const overflowPixels = Math.max(0, root.scrollWidth - viewportWidth);
              const culprits = [...document.body.querySelectorAll("*")]
                .filter(element => !["SCRIPT", "STYLE", "LINK", "META"].includes(element.tagName))
                .filter(element => {
                  const rect = element.getBoundingClientRect();
                  return rect.right > viewportWidth + 2 || rect.left < -2;
                })
                .slice(0, 6)
                .map(selectorFor);
              parent.postMessage({
                type: "lw-reader-preview-report",
                token,
                stage,
                viewportWidth,
                documentWidth: root.scrollWidth,
                overflowPixels,
                culprits,
                mathCount: document.querySelectorAll("mjx-container").length,
                scriptCount: document.scripts.length,
                chapterRows: document.querySelectorAll(".chapter-head-row").length,
                termMarks: document.querySelectorAll(".term-mark").length
              }, "*");
            };
            addEventListener("message", event => {
              if (event.data?.type === "lw-reader-preview-print" && event.data.token === token) print();
              if (event.data?.type === "lw-reader-preview-measure" && event.data.token === token) report("resized");
            });
            let resizeTimer;
            addEventListener("resize", () => {
              clearTimeout(resizeTimer);
              resizeTimer = setTimeout(() => report("resized"), 100);
            });
            document.addEventListener("DOMContentLoaded", () => report("dom-ready"));
            addEventListener("load", () => report("loaded"));
            [400, 1200, 3000].forEach((delay, index) => setTimeout(() => report(index === 2 ? "settled" : "rendering"), delay));
            if (window.MathJax?.startup?.promise) {
              Promise.resolve(window.MathJax.startup.promise).then(() => report("math-ready"), () => report("math-error"));
            }
          })();
        <\/script>`;
      }

      function injectPreviewInstrumentation(html, token) {
        const instrumentation = previewInstrumentation(token);
        if (/<\/body\s*>/i.test(html)) return html.replace(/<\/body\s*>/i, `${instrumentation}</body>`);
        return `${html}${instrumentation}`;
      }

      function applyPreviewWidth(width = previewWidth) {
        previewWidth = width;
        previewFrameWrap.style.width = width === "desktop" ? "100%" : `${Number(width)}px`;
        previewDialog.querySelectorAll("button[data-preview-width]").forEach(button => {
          const active = button.dataset.previewWidth === String(width);
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        previewReport.textContent = width === "desktop"
          ? "Desktop viewport · checking layout…"
          : `${width} px viewport · checking layout…`;
        previewReport.classList.remove("warning");
      }

      let previewExpectsMath = false;

      async function loadReaderPreview() {
        const sequence = ++previewSequence;
        const html = currentHtml();
        previewExpectsMath = /\$\$[\s\S]*?\$\$|\\\([^)]*\\\)|\\\[[\s\S]*?\\\]/.test(html);
        previewToken = typeof crypto.randomUUID === "function"
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        previewReport.textContent = "Preparing isolated reader preview…";
        previewReport.classList.remove("warning");
        try {
          const prepared = await prepareHtmlForVisual(html);
          if (sequence !== previewSequence || !previewDialog.open) return;
          previewFrame.srcdoc = injectPreviewInstrumentation(prepared, previewToken);
        } catch (error) {
          if (sequence !== previewSequence) return;
          previewReport.textContent = `Preview failed: ${error.message}`;
          previewReport.classList.add("warning");
        }
      }

      function openReaderPreview() {
        if (!previewDialog.open) previewDialog.showModal();
        applyPreviewWidth(previewWidth);
        loadReaderPreview();
      }

      function closeReaderPreview() {
        previewSequence += 1;
        previewToken = "";
        previewFrame.removeAttribute("srcdoc");
        previewReport.textContent = "Preview not loaded";
        previewReport.classList.remove("warning");
        if (previewDialog.open) previewDialog.close();
      }

      function handlePreviewReport(event) {
        const data = event.data;
        if (!previewDialog.open || data?.type !== "lw-reader-preview-report" || data.token !== previewToken) return;
        const width = previewWidth === "desktop"
          ? `${data.viewportWidth} px desktop`
          : `${previewWidth} px frame (${data.viewportWidth} px content)`;
        const layout = data.overflowPixels
          ? `horizontal overflow +${data.overflowPixels}px${data.culprits.length ? ` (${data.culprits.join(", ")})` : ""}`
          : "no horizontal overflow";
        const math = previewExpectsMath
          ? (data.mathCount ? `MathJax rendered ${data.mathCount}` : "MathJax loading or unavailable")
          : "no maths detected";
        const enhancements = data.chapterRows || data.termMarks
          ? `reader scripts active (${data.chapterRows} chapter headers, ${data.termMarks} term marks)`
          : "reader scripts loaded";
        previewReport.textContent = `${width} · ${layout} · ${math} · ${enhancements}`;
        const mathFailed = previewExpectsMath && ["settled", "math-error"].includes(data.stage) && !data.mathCount;
        previewReport.classList.toggle("warning", Boolean(data.overflowPixels || mathFailed));
      }

      function checkDocumentIntegrity(html = currentHtml()) {
        const doc = new DOMParser().parseFromString(html, "text/html");
        const errors = [];
        const warnings = [];
        const issues = [];

        function issueTargetId(element) {
          if (!element) return "";
          if (element.id) return element.id;
          return element.closest?.("[id]")?.id || "";
        }

        function addIssue(severity, message, element = null) {
          const item = { severity, message, targetId: issueTargetId(element) };
          issues.push(item);
          (severity === "error" ? errors : warnings).push(message);
        }

        const ids = new Map();
        for (const element of doc.querySelectorAll("[id]")) {
          const id = element.id;
          if (!id) {
            addIssue("warning", `Empty id on <${element.tagName.toLowerCase()}>.`, element);
            continue;
          }
          ids.set(id, (ids.get(id) || 0) + 1);
        }
        const duplicateIds = [...ids].filter(([, count]) => count > 1).map(([id]) => id);
        if (duplicateIds.length) {
          addIssue(
            "error",
            `Duplicate id(s): ${duplicateIds.join(", ")}`,
            doc.getElementById(duplicateIds[0])
          );
        }

        const brokenInternal = new Map();
        for (const link of doc.querySelectorAll("a[href^='#']")) {
          const raw = link.getAttribute("href").slice(1);
          if (!raw) continue;
          const id = safeDecode(raw);
          if (!ids.has(id) && !brokenInternal.has(id)) brokenInternal.set(id, link);
        }
        for (const [id, link] of brokenInternal) {
          addIssue("error", `Broken internal link: #${id}`, link);
        }

        for (const link of doc.querySelectorAll("a[href]")) {
          const href = link.getAttribute("href") || "";
          if (/^(?:javascript|vbscript|data):/i.test(href)) {
            addIssue("error", `Unsafe link URL: ${href}`, link);
          }
        }

        const refs = [...doc.querySelectorAll("a.footnote-ref")];
        const notes = new Map(
          [...doc.querySelectorAll("section.footnotes li[id^='fn:']")]
            .map(note => [note.id.slice(3), note])
        );
        const referencedKeys = [];
        refs.forEach((link, index) => {
          const href = link.getAttribute("href") || "";
          const key = href.startsWith("#fn:") ? href.slice(4) : "";
          const sup = link.closest("sup");
          if (!key || !sup || sup.id !== `fnref:${key}`) {
            addIssue("error", `Malformed footnote reference near number ${link.textContent.trim() || index + 1}.`, link);
            return;
          }
          referencedKeys.push(key);
          if (!notes.has(key)) addIssue("error", `Footnote reference ${key} has no matching note.`, link);
          if (link.textContent.trim() !== String(index + 1)) {
            addIssue(
              "error",
              `Footnote ${key} is numbered ${link.textContent.trim() || "?"}, expected ${index + 1}.`,
              link
            );
          }
          const backref = notes.get(key)?.querySelector("a.footnote-backref, a.footnote");
          if (!backref || backref.getAttribute("href") !== `#fnref:${key}`) {
            addIssue("error", `Footnote ${key} has no valid back-reference.`, notes.get(key) || link);
          }
        });
        if (new Set(referencedKeys).size !== referencedKeys.length) {
          addIssue("error", "A footnote is referenced more than once.");
        }
        const orphans = [...notes.keys()].filter(key => !referencedKeys.includes(key));
        if (orphans.length) {
          addIssue("error", `Footnote(s) without a reference: ${orphans.join(", ")}`, notes.get(orphans[0]));
        }

        const missingHeadingIds = [...doc.querySelectorAll("article h2:not([id]), article h3:not([id])")]
          .filter(heading => !heading.closest("figure, aside, details, .part-divider, .exercise"));
        for (const heading of missingHeadingIds) {
          addIssue(
            "warning",
            `Heading “${outlineHeadingText(heading)}” has no id and cannot be linked internally.`,
            heading
          );
        }

        for (const image of doc.querySelectorAll("img")) {
          if (!image.hasAttribute("alt") || !image.getAttribute("alt").trim()) {
            addIssue("warning", `Image ${image.getAttribute("src") || "(without src)"} has no alternative text.`, image);
          }
        }

        for (const element of doc.querySelectorAll("[aria-labelledby], [aria-describedby], label[for]")) {
          for (const attribute of ["aria-labelledby", "aria-describedby", "for"]) {
            const value = element.getAttribute(attribute);
            if (!value) continue;
            for (const id of value.trim().split(/\s+/)) {
              if (!ids.has(id)) addIssue("error", `${attribute} points to missing id #${id}.`, element);
            }
          }
        }

        for (const figure of doc.querySelectorAll("figure.ir-figure")) {
          if (!figure.querySelector(":scope > .figure-title")) {
            addIssue("warning", "Textbook figure has no direct .figure-title.", figure);
          }
          const caption = figure.querySelector(":scope > figcaption");
          if (!caption) addIssue("error", "Textbook figure has no figcaption.", figure);
          else if (!caption.querySelector(".asset-label-inline")) {
            addIssue("warning", "Textbook figure caption has no numbered asset label.", figure);
          }
        }

        for (const table of doc.querySelectorAll(".table-wrap > table")) {
          if (!table.parentElement.previousElementSibling?.classList.contains("asset-label")) {
            addIssue("warning", "Textbook table has no .asset-label immediately before .table-wrap.", table);
          }
        }

        for (const details of doc.querySelectorAll("details")) {
          if (!details.querySelector(":scope > summary")) {
            addIssue("error", "A details element has no direct summary.", details);
          }
        }

        const missingLocal = new Set();
        if (projectFiles.size) {
          for (const element of doc.querySelectorAll("[href], [src], [poster], [data]")) {
            for (const attribute of ["href", "src", "poster", "data"]) {
              if (!element.hasAttribute(attribute)) continue;
              const reference = element.getAttribute(attribute);
              const resolved = resolveProjectPath(reference);
              if (resolved && !getProjectFile(resolved)) missingLocal.add(reference);
            }
          }
        }
        if (missingLocal.size) addIssue("warning", `Missing local file(s): ${[...missingLocal].join(", ")}`);

        return {
          errors,
          warnings,
          issues,
          counts: {
            ids: ids.size,
            internalLinks: doc.querySelectorAll("a[href^='#']").length,
            footnotes: refs.length,
            figures: doc.querySelectorAll("figure").length,
            tables: doc.querySelectorAll("table").length,
            images: doc.querySelectorAll("img").length
          }
        };
      }

      function integritySummary(report) {
        if (report.errors.length) {
          return `${report.errors.length} error${report.errors.length === 1 ? "" : "s"}` +
            (report.warnings.length ? ` and ${report.warnings.length} warning${report.warnings.length === 1 ? "" : "s"}` : "");
        }
        if (report.warnings.length) {
          return `${report.warnings.length} warning${report.warnings.length === 1 ? "" : "s"}`;
        }
        return `passed: ${report.counts.ids} ids, ${report.counts.internalLinks} internal links, ${report.counts.footnotes} footnotes`;
      }

      function renderDiagnostics(report) {
        diagnosticsPanel.hidden = false;
        diagnosticsSummary.textContent = `Check ${integritySummary(report)}. ` +
          `${report.counts.figures} figures, ${report.counts.tables} tables and ${report.counts.images} images inspected.`;
        diagnosticsList.replaceChildren();

        if (!report.issues.length) {
          const ok = document.createElement("p");
          ok.className = "diagnostic-ok";
          ok.textContent = "No document-integrity problems were found.";
          diagnosticsList.appendChild(ok);
          return;
        }

        for (const item of report.issues) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `diagnostic-item ${item.severity}`;
          button.textContent = `${item.severity.toUpperCase()}: ${item.message}`;
          if (item.targetId) {
            button.dataset.targetId = item.targetId;
            button.title = `Jump to #${item.targetId}`;
          } else {
            button.disabled = true;
          }
          diagnosticsList.appendChild(button);
        }
      }

      async function jumpToDiagnosticTarget(targetId) {
        if (!targetId) return;
        if (currentMode === "source") {
          await switchMode("visual");
          setTimeout(() => jumpToDiagnosticTarget(targetId), 100);
          return;
        }
        const doc = editorDocument();
        const target = doc?.getElementById(targetId);
        if (!target) {
          setStatus(`Could not find #${targetId} in the visual editor.`, true);
          return;
        }
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        const range = doc.createRange();
        range.selectNodeContents(target);
        range.collapse(true);
        restoreVisualRange(doc, range);
        updateOutlineActive(doc);
        setStatus(`Jumped to #${targetId}.`);
      }

      function showIntegrityCheck() {
        const report = checkDocumentIntegrity();
        const summary = integritySummary(report);
        setStatus(`Check ${summary}.`, Boolean(report.errors.length));
        renderDiagnostics(report);
        return report;
      }

      function downloadNamedHtml(html, filename) {
        const blob = new Blob([html], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename || "document.html";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }

      function downloadHtml(html) {
        downloadNamedHtml(html, currentFilename || "document.html");
        baselineHtml = html;
        markDirty(false);
        acceptVisualHistoryBaseline();
        setStatus(`Downloaded ${currentFilename}. Replace the repository copy with this file if your browser renamed or relocated it.`);
      }

      function backupFilename() {
        const stamp = new Date().toISOString().replace(/[:T]/g, "-").replace(/\.\d+Z$/, "Z");
        const stem = (currentFilename || "document.html").replace(/\.html?$/i, "");
        return `${stem}.backup-${stamp}.html`;
      }

      function downloadBaselineBackup() {
        if (!baselineHtml) {
          setStatus("There is no opened or previously saved version to back up.", true);
          return;
        }
        const filename = backupFilename();
        downloadNamedHtml(baselineHtml, filename);
        setStatus(`Downloaded backup ${filename}.`);
      }

      function summariseHtml(html) {
        const doc = new DOMParser().parseFromString(html, "text/html");
        const text = doc.body?.textContent || "";
        const ids = new Map(
          [...doc.querySelectorAll("[id]")].map(element => [element.id, element.outerHTML])
        );
        return {
          normalised: doc.documentElement?.outerHTML || html,
          words: text.trim() ? text.trim().split(/\s+/).length : 0,
          characters: text.length,
          bytes: new Blob([html]).size,
          ids,
          counts: {
            elements: doc.querySelectorAll("body *").length,
            headings: doc.querySelectorAll("h1, h2, h3, h4, h5, h6").length,
            links: doc.querySelectorAll("a[href]").length,
            images: doc.querySelectorAll("img").length,
            figures: doc.querySelectorAll("figure").length,
            tables: doc.querySelectorAll("table").length,
            footnotes: doc.querySelectorAll("a.footnote-ref").length,
            ids: ids.size
          }
        };
      }

      function compareDocuments(beforeHtml, afterHtml) {
        const before = summariseHtml(beforeHtml || starterDocument);
        const after = summariseHtml(afterHtml);
        const addedIds = [...after.ids.keys()].filter(id => !before.ids.has(id));
        const removedIds = [...before.ids.keys()].filter(id => !after.ids.has(id));
        const changedIds = [...after.ids.keys()].filter(id =>
          before.ids.has(id) && before.ids.get(id) !== after.ids.get(id)
        );
        const countChanges = [];
        for (const key of Object.keys(after.counts)) {
          if (before.counts[key] !== after.counts[key]) {
            countChanges.push(`${key}: ${before.counts[key].toLocaleString()} → ${after.counts[key].toLocaleString()}`);
          }
        }
        if (before.words !== after.words) {
          countChanges.push(`words: ${before.words.toLocaleString()} → ${after.words.toLocaleString()}`);
        }
        if (before.characters !== after.characters) {
          countChanges.push(`text characters: ${before.characters.toLocaleString()} → ${after.characters.toLocaleString()}`);
        }
        return {
          changed: before.normalised !== after.normalised,
          bytesBefore: before.bytes,
          bytesAfter: after.bytes,
          countChanges,
          addedIds,
          removedIds,
          changedIds
        };
      }

      function appendReviewList(title, items, limit = 18) {
        const heading = document.createElement("h3");
        heading.textContent = title;
        saveReviewBody.appendChild(heading);
        if (!items.length) {
          const empty = document.createElement("p");
          empty.className = "dialog-note";
          empty.textContent = "None.";
          saveReviewBody.appendChild(empty);
          return;
        }
        const list = document.createElement("ul");
        items.slice(0, limit).forEach(item => {
          const li = document.createElement("li");
          li.textContent = item;
          list.appendChild(li);
        });
        if (items.length > limit) {
          const li = document.createElement("li");
          li.textContent = `…and ${items.length - limit} more`;
          list.appendChild(li);
        }
        saveReviewBody.appendChild(list);
      }

      function renderSaveReview(diff, report) {
        saveReviewBody.replaceChildren();

        const summary = document.createElement("p");
        summary.className = "dialog-note";
        summary.textContent = diff.changed
          ? `The document changed. File size is ${diff.bytesBefore.toLocaleString()} → ${diff.bytesAfter.toLocaleString()} bytes.`
          : "No semantic DOM changes were detected against the last opened or saved version.";
        saveReviewBody.appendChild(summary);

        appendReviewList("Count changes", diff.countChanges);
        appendReviewList("Added IDs", diff.addedIds.map(id => `#${id}`));
        appendReviewList("Removed IDs", diff.removedIds.map(id => `#${id}`));
        appendReviewList("Changed identified elements", diff.changedIds.map(id => `#${id}`));

        const diagnosticItems = [
          ...report.errors.map(item => `ERROR: ${item}`),
          ...report.warnings.map(item => `WARNING: ${item}`)
        ];
        appendReviewList(`Diagnostics — ${integritySummary(report)}`, diagnosticItems, 12);

        backupSaveReviewBtn.disabled = !baselineHtml;
        confirmSaveReviewBtn.textContent = currentFileHandle?.createWritable
          ? (report.errors.length ? "Save anyway" : "Save HTML")
          : (report.errors.length ? "Download anyway" : "Download HTML");
      }

      function finishSaveReview(result) {
        if (saveReviewDialog.open) saveReviewDialog.close();
        const resolve = pendingSaveReview;
        pendingSaveReview = null;
        resolve?.(result);
      }

      function reviewBeforeSave(html, report) {
        const diff = compareDocuments(baselineHtml || starterDocument, html);
        renderSaveReview(diff, report);
        if (!saveReviewDialog.showModal) {
          return Promise.resolve(confirm(
            `Review: ${diff.countChanges.join(", ") || "no count changes"}. ` +
            `Check ${integritySummary(report)}. Continue?`
          ) ? "save" : "cancel");
        }
        saveReviewDialog.showModal();
        return new Promise(resolve => { pendingSaveReview = resolve; });
      }

      async function ensureWritePermission(handle) {
        if (!handle?.queryPermission || !handle?.requestPermission) return true;
        const options = { mode: "readwrite" };
        if (await handle.queryPermission(options) === "granted") return true;
        return await handle.requestPermission(options) === "granted";
      }

      async function writeHtmlToHandle(handle, html) {
        if (!await ensureWritePermission(handle)) throw new Error("Write permission was not granted");
        const writable = await handle.createWritable();
        try {
          await writable.write(new Blob([html], { type: "text/html;charset=utf-8" }));
          await writable.close();
        } catch (error) {
          try { await writable.abort(); } catch { /* The stream may already be closed. */ }
          throw error;
        }
      }

      async function saveFile() {
        if (saveInProgress || saveReviewDialog.open) return;
        if (currentMode === "source") {
          updateTextbookMode(new DOMParser().parseFromString(sourceEditor.value, "text/html"));
        }
        const maintenance = textbookMode ? maintainCurrentTextbook({ announce: false }) : null;
        const html = currentHtml({ renumberVisualFootnotes: true });
        const report = mergeMaintenanceProblems(checkDocumentIntegrity(html), maintenance);
        const reviewResult = await reviewBeforeSave(html, report);
        if (reviewResult !== "save") {
          setStatus("Save cancelled.");
          return;
        }

        if (!currentFileHandle?.createWritable) {
          downloadHtml(html);
          return;
        }

        saveInProgress = true;
        saveBtn.disabled = true;
        setStatus(`Saving directly to ${currentFilename}…`);
        try {
          await writeHtmlToHandle(currentFileHandle, html);
          if (currentDocumentPath && projectFiles.has(currentDocumentPath)) {
            registerProjectFile(currentDocumentPath, await currentFileHandle.getFile(), currentFileHandle);
          }
          baselineHtml = html;
          markDirty(false);
          acceptVisualHistoryBaseline();
          setStatus(`Saved directly to ${currentFilename}. Git can now review the change.`);
        } catch (error) {
          setStatus(`Could not save directly: ${error.message}`, true);
          if (confirm("Direct save failed. Download the edited HTML instead?")) downloadHtml(html);
        } finally {
          saveInProgress = false;
          saveBtn.disabled = false;
        }
      }

      async function showOpenedHtml(html, fileName, documentPath = "") {
        diagnosticsPanel.hidden = true;
        outlineSearch.value = "";
        currentFilename = fileName.replace(/\.(html?)$/i, "") + ".html";
        updateSaveButton();
        currentDocumentPath = normalisePath(documentPath);
        storedDoctype = extractDoctype(html);
        sourceEditor.value = html;

        if (currentMode === "source") {
          sourceEditor.classList.add("hidden");
          visualEditor.classList.remove("hidden");
          toolbar.querySelectorAll("button, select").forEach(el => el.disabled = false);
          sourceModeBtn.classList.remove("active");
          visualModeBtn.classList.add("active");
          currentMode = "visual";
        }

        await loadVisual(html);
        baselineHtml = html;
        markDirty(false);
      }

      async function openFile(file, handle = null) {
        if (!file) return;
        try {
          clearProject();
          setCurrentFileHandle(handle);
          const html = await file.text();
          await showOpenedHtml(html, file.name, file.name);
          setStatus(
            handle
              ? `Opened ${file.name} with direct-save access. Use Open Folder if local images need to be displayed.`
              : `Opened ${file.name} read-only. Saving will download a replacement file.`
          );
        } catch (error) {
          setCurrentFileHandle(null);
          setStatus(`Could not open file: ${error.message}`, true);
        } finally {
          fileInput.value = "";
        }
      }

      async function openHtmlFile() {
        if (!confirmDiscardUnsaved("open another HTML file")) return;
        if (!window.showOpenFilePicker) {
          fileInput.click();
          return;
        }

        try {
          const [handle] = await window.showOpenFilePicker({
            id: "lightweight-html-editor-document",
            multiple: false,
            types: [{
              description: "HTML documents",
              accept: { "text/html": [".html", ".htm"] }
            }]
          });
          await openFile(await handle.getFile(), handle);
        } catch (error) {
          if (error?.name === "AbortError") {
            setStatus("Opening cancelled");
            return;
          }
          setStatus("Direct file access is unavailable; using the read-only file picker.");
          fileInput.click();
        }
      }

      async function indexDirectoryHandle(directoryHandle, prefix = "") {
        for await (const [name, handle] of directoryHandle.entries()) {
          const path = normalisePath(`${prefix}/${name}`);
          if (handle.kind === "directory") {
            if ([".git", "node_modules", ".venv", "__pycache__"].includes(name)) continue;
            await indexDirectoryHandle(handle, path);
          } else {
            const file = await handle.getFile();
            registerProjectFile(path, file, handle);
          }
        }
      }

      async function openWritableFolder() {
        if (!confirmDiscardUnsaved("open another folder")) return;
        if (!window.showDirectoryPicker) {
          folderInput.click();
          return;
        }

        try {
          const directoryHandle = await window.showDirectoryPicker({
            id: "lightweight-html-editor-project",
            mode: "readwrite"
          });
          clearProject();
          projectDirectoryHandle = directoryHandle;
          projectRootName = directoryHandle.name || "selected folder";
          setStatus("Indexing project folder");
          await indexDirectoryHandle(directoryHandle);

          const htmlEntries = [...projectFiles.entries()]
            .filter(([path]) => /\.html?$/i.test(path))
            .map(([path, file]) => ({ file, path }))
            .sort((a, b) => a.path.localeCompare(b.path));

          if (!htmlEntries.length) {
            clearProject();
            setStatus("The selected folder contains no HTML files", true);
            return;
          }

          const selected = chooseHtmlFile(htmlEntries);
          if (!selected) {
            clearProject();
            setStatus("Folder opening cancelled");
            return;
          }

          const html = await selected.file.text();
          setCurrentFileHandle(projectFileHandles.get(selected.path) || null);
          await showOpenedHtml(html, basename(selected.path), selected.path);
          setStatus(
            `Opened ${selected.path} with writable access to ${projectRootName}. ` +
            "Save writes back to this HTML file, and inserted images can be copied into the project automatically."
          );
        } catch (error) {
          if (error?.name === "AbortError") {
            setStatus("Folder opening cancelled");
            return;
          }
          setStatus("Writable folder access is unavailable; using the read-only folder picker.");
          folderInput.click();
        }
      }

      function folderRelativePath(file) {
        const raw = file.webkitRelativePath || file.name;
        const parts = raw.replace(/\\/g, "/").split("/").filter(Boolean);
        if (parts.length > 1) parts.shift();
        return normalisePath(parts.join("/"));
      }

      function chooseHtmlFile(htmlEntries) {
        if (htmlEntries.length === 1) return htmlEntries[0];

        const preferredNames = [currentFilename, "search-textbook.html", "index.html"];
        let preferredIndex = -1;
        for (const name of preferredNames) {
          preferredIndex = htmlEntries.findIndex(entry => basename(entry.path).toLowerCase() === name.toLowerCase());
          if (preferredIndex !== -1) break;
        }
        preferredIndex = Math.max(0, preferredIndex);
        const visible = htmlEntries.slice(0, 50);
        const choices = visible.map((entry, index) => `${index + 1}. ${entry.path}`).join("\n");
        const extra = htmlEntries.length > visible.length
          ? `\n\nOnly the first ${visible.length} of ${htmlEntries.length} files are listed.`
          : "";
        const answer = prompt(
          `Choose the HTML file to edit by number:\n\n${choices}${extra}`,
          String(Math.min(preferredIndex, visible.length - 1) + 1)
        );
        if (answer === null) return null;
        const selectedIndex = Number.parseInt(answer, 10) - 1;
        return visible[selectedIndex] || visible[preferredIndex] || visible[0];
      }

      async function openFolder(files) {
        const selectedFiles = [...files];
        folderInput.value = "";
        if (!selectedFiles.length) return;

        try {
          clearProject();
          const firstPath = selectedFiles[0].webkitRelativePath || "";
          projectRootName = firstPath.split(/[\\/]/)[0] || "selected folder";

          for (const file of selectedFiles) {
            const path = folderRelativePath(file);
            registerProjectFile(path, file);
          }

          const htmlEntries = selectedFiles
            .map(file => ({ file, path: folderRelativePath(file) }))
            .filter(entry => /\.html?$/i.test(entry.path))
            .sort((a, b) => a.path.localeCompare(b.path));

          if (!htmlEntries.length) {
            clearProject();
            setStatus("The selected folder contains no HTML files", true);
            return;
          }

          const selected = chooseHtmlFile(htmlEntries);
          if (!selected) {
            clearProject();
            setStatus("Folder opening cancelled");
            return;
          }

          const html = await selected.file.text();
          await showOpenedHtml(html, basename(selected.path), selected.path);
          setStatus(`Opened ${selected.path} with access to ${selectedFiles.length - 1} neighbouring files.`);
        } catch (error) {
          clearProject();
          setStatus(`Could not open folder: ${error.message}`, true);
        }
      }

      async function newDocument() {
        if (!confirmDiscardUnsaved("create a new document")) return;
        diagnosticsPanel.hidden = true;
        outlineSearch.value = "";
        clearProject();
        currentFilename = "untitled.html";
        updateSaveButton();
        currentDocumentPath = "untitled.html";
        storedDoctype = "<!doctype html>";
        sourceEditor.value = starterDocument;
        if (currentMode === "source") {
          sourceEditor.classList.add("hidden");
          visualEditor.classList.remove("hidden");
          toolbar.querySelectorAll("button, select").forEach(el => el.disabled = false);
          sourceModeBtn.classList.remove("active");
          visualModeBtn.classList.add("active");
          currentMode = "visual";
        }
        await loadVisual(starterDocument);
        baselineHtml = starterDocument;
        markDirty(false);
        setStatus("New document");
      }

      visualModeBtn.addEventListener("click", () => switchMode("visual"));
      sourceModeBtn.addEventListener("click", () => switchMode("source"));
      outlineToggleBtn.addEventListener("click", () => {
        setOutlineExpanded(document.body.classList.contains("outline-collapsed"));
      });
      outlineSearch.addEventListener("input", filterOutline);
      outlineList.addEventListener("click", event => {
        const button = event.target.closest("button[data-outline-index]");
        if (button) jumpToOutlineTarget(Number(button.dataset.outlineIndex));
      });
      document.getElementById("closeDiagnosticsBtn").addEventListener("click", () => {
        diagnosticsPanel.hidden = true;
      });
      document.getElementById("diagnosticsSaveBtn").addEventListener("click", () => {
        diagnosticsPanel.hidden = true;
        saveFile();
      });
      diagnosticsList.addEventListener("click", event => {
        const button = event.target.closest("button[data-target-id]");
        if (button) jumpToDiagnosticTarget(button.dataset.targetId);
      });
      document.getElementById("cancelSaveReviewBtn").addEventListener("click", () => finishSaveReview("cancel"));
      backupSaveReviewBtn.addEventListener("click", downloadBaselineBackup);
      confirmSaveReviewBtn.addEventListener("click", () => finishSaveReview("save"));
      saveReviewDialog.addEventListener("cancel", event => {
        event.preventDefault();
        finishSaveReview("cancel");
      });

      document.getElementById("newBtn").addEventListener("click", newDocument);
      document.getElementById("openBtn").addEventListener("click", openHtmlFile);
      document.getElementById("openFolderBtn").addEventListener("click", openWritableFolder);
      document.getElementById("checkBtn").addEventListener("click", showIntegrityCheck);
      document.getElementById("previewBtn").addEventListener("click", openReaderPreview);
      saveBtn.addEventListener("click", saveFile);
      fileInput.addEventListener("change", () => openFile(fileInput.files[0]));
      folderInput.addEventListener("change", () => openFolder(folderInput.files));
