<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lightweight WYSIWYG HTML Editor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --panel: #ffffff;
      --panel-2: #f8f9fb;
      --text: #202124;
      --muted: #68707c;
      --border: #d9dde3;
      --accent: #2457d6;
      --accent-contrast: #ffffff;
      --danger: #b3261e;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191d;
        --panel: #202328;
        --panel-2: #262a30;
        --text: #f1f3f4;
        --muted: #aab1bb;
        --border: #3b414a;
        --accent: #8ab4f8;
        --accent-contrast: #10203d;
        --danger: #f28b82;
        --shadow: 0 1px 4px rgba(0,0,0,.35);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      min-height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 3;
    }

    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
    }

    #filename {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      font-size: .86rem;
    }

    #textbookModeBadge {
      flex: 0 0 auto;
      padding: .22rem .5rem;
      border-radius: 999px;
      background: #e7f3ef;
      color: #155b50;
      font-size: .72rem;
      font-weight: 750;
    }

    #textbookModeBadge[hidden] { display: none; }

    .spacer { flex: 1; }

    button, select, input[type="text"] {
      font: inherit;
    }

    button, select {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
    }

    button {
      padding: .35rem .65rem;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: var(--panel-2);
    }

    button:focus-visible, select:focus-visible, textarea:focus-visible, iframe:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 1px;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    .primary {
      background: var(--accent);
      color: var(--accent-contrast);
      border-color: transparent;
      font-weight: 650;
    }

    .primary:hover:not(:disabled) {
      filter: brightness(.96);
      background: var(--accent);
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: .35rem;
      padding: .5rem .75rem;
      overflow-x: auto;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      scrollbar-width: thin;
      z-index: 2;
    }

    #textbookToolbar {
      display: flex;
      align-items: center;
      gap: .35rem;
      padding: .42rem .75rem;
      overflow-x: auto;
      background: #edf5f2;
      border-bottom: 1px solid var(--border);
      scrollbar-width: thin;
      z-index: 2;
    }

    #textbookToolbar[hidden] { display: none; }
    #textbookToolbar .toolbar-label {
      flex: 0 0 auto;
      color: #155b50;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    #textbookToolbar button { flex: 0 0 auto; padding: .3rem .55rem; }

    #toolbar button {
      min-width: 34px;
      padding: .3rem .55rem;
      font-weight: 600;
    }

    #toolbar button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    #toolbar select {
      padding: .3rem .45rem;
      max-width: 145px;
    }

    .separator {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 .15rem;
      flex: 0 0 auto;
    }

    .mode-switch {
      display: inline-flex;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .mode-switch button {
      border: 0;
      min-height: 28px;
      padding: .25rem .65rem;
      background: transparent;
    }

    .mode-switch button.active {
      background: var(--panel);
      box-shadow: var(--shadow);
      color: var(--accent);
    }

    main {
      position: relative;
      min-height: 0;
      padding: .75rem;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      gap: .75rem;
    }

    body.outline-collapsed main {
      grid-template-columns: minmax(0, 1fr);
    }

    #outlinePanel {
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: .55rem;
      padding: .75rem;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    body.outline-collapsed #outlinePanel { display: none; }

    .outline-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: .5rem;
    }

    .outline-header strong { font-size: .86rem; }
    #outlineCount { color: var(--muted); font-size: .72rem; white-space: nowrap; }

    #outlineSearch {
      width: 100%;
      min-height: 34px;
      padding: .4rem .55rem;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
    }

    #outlineList {
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scrollbar-width: thin;
    }

    #outlineList button {
      width: 100%;
      min-height: 0;
      padding: .36rem .45rem;
      border: 0;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      font-size: .78rem;
      font-weight: 500;
      line-height: 1.35;
    }

    #outlineList button.level-1,
    #outlineList button.level-2 { font-weight: 750; color: var(--text); }
    #outlineList button.level-3 { padding-left: 1.15rem; color: var(--muted); }
    #outlineList button.active { background: var(--panel-2); color: var(--accent); }
    #outlineList .outline-empty { margin: .35rem; color: var(--muted); font-size: .78rem; }

    .editor-shell {
      height: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    #visualEditor, #sourceEditor {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }

    #sourceEditor {
      resize: none;
      padding: 1rem;
      background: #111318;
      color: #e8eaed;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      tab-size: 2;
    }

    footer {
      display: flex;
      align-items: center;
      gap: .75rem;
      min-height: 32px;
      padding: .35rem .85rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: .8rem;
    }

    #status {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hidden { display: none !important; }

    .danger { color: var(--danger); }

    #diagnosticsPanel {
      position: fixed;
      inset: 0 0 0 auto;
      z-index: 20;
      width: min(430px, 100vw);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 30px rgba(0,0,0,.18);
    }

    #diagnosticsPanel[hidden] { display: none; }

    .panel-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .8rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .panel-header h2 { margin: 0; font-size: 1rem; }
    .panel-header h2 + button { margin-left: auto; }

    #diagnosticsSummary {
      margin: 0;
      padding: .75rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: .82rem;
    }

    #diagnosticsList {
      min-height: 0;
      overflow: auto;
      padding: .75rem;
    }

    .diagnostic-item {
      display: block;
      width: 100%;
      min-height: 0;
      margin: 0 0 .5rem;
      padding: .7rem .75rem;
      border: 1px solid var(--border);
      border-left: 4px solid var(--muted);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--text);
      text-align: left;
      font-size: .8rem;
      font-weight: 500;
      line-height: 1.45;
    }

    .diagnostic-item.error { border-left-color: var(--danger); }
    .diagnostic-item.warning { border-left-color: #b97800; }
    .diagnostic-item:disabled { opacity: 1; cursor: default; }
    .diagnostic-ok { color: var(--muted); font-size: .84rem; }

    dialog {
      width: min(700px, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 24px 70px rgba(0,0,0,.3);
    }

    dialog::backdrop { background: rgba(0,0,0,.42); }

    .dialog-body {
      max-height: calc(100vh - 11rem);
      overflow: auto;
      padding: 1rem 1.15rem;
    }

    .dialog-body h3 { margin: 1rem 0 .45rem; font-size: .9rem; }
    .dialog-body h3:first-child { margin-top: 0; }
    .dialog-body ul { margin: .4rem 0 0; padding-left: 1.25rem; }
    .dialog-body li { margin: .3rem 0; font-size: .82rem; }
    .dialog-note { color: var(--muted); font-size: .82rem; }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: .55rem;
      padding: .75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
    }

    .structure-form { margin: 0; }
    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: .8rem 1rem;
    }

    .form-grid label {
      display: flex;
      flex-direction: column;
      gap: .3rem;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
    }

    .form-grid label.full { grid-column: 1 / -1; }
    .form-grid input,
    .form-grid select,
    .form-grid textarea {
      width: 100%;
      min-height: 36px;
      padding: .48rem .55rem;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      font-weight: 400;
    }

    .form-grid textarea { min-height: 90px; resize: vertical; }
    .form-help { margin: .75rem 0 0; color: var(--muted); font-size: .76rem; }

    #previewDialog {
      width: calc(100vw - 1.5rem);
      height: calc(100vh - 1.5rem);
      max-width: none;
      max-height: none;
    }

    .preview-layout {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .preview-toolbar {
      display: flex;
      align-items: center;
      gap: .45rem;
      padding: .55rem .8rem;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
    }

    .preview-toolbar .toolbar-label {
      color: var(--muted);
      font-size: .76rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .preview-toolbar button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    #previewReport {
      margin-left: auto;
      color: var(--muted);
      font-size: .76rem;
      white-space: nowrap;
    }

    #previewReport.warning { color: #a76300; font-weight: 700; }

    .preview-stage {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 1rem;
      background: #cfd4d8;
    }

    .preview-frame-wrap {
      width: 100%;
      height: 100%;
      min-height: 520px;
      margin: 0 auto;
      overflow: hidden;
      background: white;
      border-radius: 7px;
      box-shadow: 0 5px 24px rgba(0,0,0,.22);
    }

    #previewFrame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 520px;
      border: 0;
      background: white;
    }

    @media (max-width: 720px) {
      header h1 { display: none; }
      header { padding: .6rem .7rem; }
      main { padding: .45rem; }
      #toolbar { padding: .4rem; }
      #filename { display: none; }
      main { grid-template-columns: minmax(0, 1fr); }
      #outlinePanel {
        position: absolute;
        inset: .45rem auto .45rem .45rem;
        z-index: 10;
        width: min(290px, calc(100% - .9rem));
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Lightweight HTML Editor</h1>
    <span id="filename">untitled.html</span>
    <span id="textbookModeBadge" hidden>Textbook mode</span>
    <div class="spacer"></div>

    <div class="mode-switch" aria-label="Editor mode">
      <button id="visualModeBtn" class="active" type="button">Visual</button>
      <button id="sourceModeBtn" type="button">Source</button>
    </div>

    <button id="outlineToggleBtn" type="button" aria-expanded="true" title="Show or hide the document outline">Outline</button>

    <button id="newBtn" type="button">New</button>
    <button id="openBtn" type="button" title="Open one HTML file; Chrome and Edge can grant direct-save access">Open HTML</button>
    <button id="openFolderBtn" type="button" title="Open an HTML project folder with its images and stylesheets; Chrome and Edge can also grant write access">Open Folder</button>
    <button id="checkBtn" type="button" title="Check IDs, internal links, headings, local assets and footnotes">Check</button>
    <button id="previewBtn" type="button" title="Open an isolated responsive, MathJax and print preview">Preview</button>
    <button id="saveBtn" class="primary" type="button" title="Download the current HTML">Download HTML</button>
    <input id="fileInput" type="file" accept=".html,.htm,text/html" hidden>
    <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
    <input id="imageInput" type="file" accept="image/*" hidden>
  </header>

  <div id="toolbar" aria-label="Formatting toolbar">
    <button type="button" data-command="undo" title="Undo">↶</button>
    <button type="button" data-command="redo" title="Redo">↷</button>
    <span class="separator"></span>

    <select id="blockFormat" title="Block style" aria-label="Block style">
      <option value="">Block style</option>
      <option value="p">Paragraph</option>
      <option value="h1">Heading 1</option>
      <option value="h2">Heading 2</option>
      <option value="h3">Heading 3</option>
      <option value="h4">Heading 4</option>
      <option value="blockquote">Blockquote</option>
      <option value="pre">Preformatted</option>
    </select>

    <button type="button" data-command="bold" title="Bold"><strong>B</strong></button>
    <button type="button" data-command="italic" title="Italic"><em>I</em></button>
    <button type="button" data-command="underline" title="Underline"><u>U</u></button>
    <button type="button" data-command="strikeThrough" title="Strikethrough"><s>S</s></button>
    <span class="separator"></span>

    <button type="button" data-command="insertUnorderedList" title="Bulleted list">• List</button>
    <button type="button" data-command="insertOrderedList" title="Numbered list">1. List</button>
    <button type="button" data-command="outdent" title="Outdent">⇤</button>
    <button type="button" data-command="indent" title="Indent">⇥</button>
    <span class="separator"></span>

    <button id="linkBtn" type="button" title="Insert link">Link</button>
    <button id="unlinkBtn" type="button" title="Remove link">Unlink</button>
    <button id="footnoteBtn" type="button" title="Insert a numbered footnote">Footnote</button>
    <button id="imageBtn" type="button" title="Insert an image using a relative file path">Image</button>
    <button id="hrBtn" type="button" title="Horizontal rule">Rule</button>
    <span class="separator"></span>

    <button type="button" data-command="justifyLeft" title="Align left">Left</button>
    <button type="button" data-command="justifyCenter" title="Align centre">Centre</button>
    <button type="button" data-command="justifyRight" title="Align right">Right</button>
    <span class="separator"></span>

    <button type="button" data-command="removeFormat" title="Clear inline formatting">Clear</button>
  </div>

  <div id="textbookToolbar" aria-label="Textbook authoring toolbar" hidden>
    <span class="toolbar-label">Textbook</span>
    <button id="maintainTextbookBtn" class="primary" type="button" title="Renumber assets and footnotes, rebuild contents and indexes, and check cross-references">Maintain</button>
    <span class="separator"></span>
    <button type="button" data-structure="heading">Heading</button>
    <button type="button" data-structure="figure">Figure</button>
    <button type="button" data-structure="table">Table</button>
    <button type="button" data-structure="callout">Callout</button>
    <button type="button" data-structure="self-check">Self-check</button>
  </div>

  <main>
    <aside id="outlinePanel" aria-label="Document outline">
      <div class="outline-header">
        <strong>Document outline</strong>
        <span id="outlineCount">0 headings</span>
      </div>
      <input id="outlineSearch" type="search" placeholder="Find a chapter or section" aria-label="Filter document outline">
      <div id="outlineList"><p class="outline-empty">Open a document to build its outline.</p></div>
    </aside>
    <div class="editor-shell">
      <iframe
        id="visualEditor"
        title="Visual HTML editor"
        sandbox="allow-same-origin"
      ></iframe>
      <textarea
        id="sourceEditor"
        class="hidden"
        aria-label="HTML source editor"
        spellcheck="false"
      ></textarea>
    </div>
  </main>

  <footer>
    <span id="status">Ready</span>
    <div class="spacer"></div>
    <span id="count">0 words</span>
  </footer>

  <aside id="diagnosticsPanel" aria-label="Document diagnostics" hidden>
    <div class="panel-header">
      <h2>Document diagnostics</h2>
      <button id="diagnosticsSaveBtn" type="button">Review save</button>
      <button id="closeDiagnosticsBtn" type="button">Close</button>
    </div>
    <p id="diagnosticsSummary">No check has been run.</p>
    <div id="diagnosticsList"></div>
  </aside>

  <dialog id="saveReviewDialog" aria-labelledby="saveReviewTitle">
    <div class="panel-header">
      <h2 id="saveReviewTitle">Review before saving</h2>
    </div>
    <div id="saveReviewBody" class="dialog-body"></div>
    <div class="dialog-actions">
      <button id="cancelSaveReviewBtn" type="button">Cancel</button>
      <button id="backupSaveReviewBtn" type="button">Download backup</button>
      <button id="confirmSaveReviewBtn" class="primary" type="button">Save HTML</button>
    </div>
  </dialog>

  <dialog id="structureDialog" aria-labelledby="structureDialogTitle">
    <form id="structureForm" class="structure-form">
      <div class="panel-header">
        <h2 id="structureDialogTitle">Insert textbook structure</h2>
      </div>
      <div class="dialog-body">
        <div id="structureFields" class="form-grid"></div>
        <p id="structureHelp" class="form-help"></p>
      </div>
      <div class="dialog-actions">
        <button id="cancelStructureBtn" type="button">Cancel</button>
        <button id="insertStructureBtn" class="primary" type="submit">Insert</button>
      </div>
    </form>
  </dialog>

  <dialog id="previewDialog" aria-labelledby="previewTitle">
    <div class="preview-layout">
      <div class="panel-header">
        <h2 id="previewTitle">Reader preview</h2>
        <button id="reloadPreviewBtn" type="button">Reload</button>
        <button id="printPreviewBtn" type="button">Print preview</button>
        <button id="closePreviewBtn" type="button">Close</button>
      </div>
      <div class="preview-toolbar" aria-label="Responsive preview width">
        <span class="toolbar-label">Viewport</span>
        <button type="button" data-preview-width="320">320 px</button>
        <button type="button" data-preview-width="360">360 px</button>
        <button type="button" data-preview-width="768">768 px</button>
        <button type="button" data-preview-width="desktop" class="active">Desktop</button>
        <span id="previewReport" role="status" aria-live="polite">Preview not loaded</span>
      </div>
      <div class="preview-stage">
        <div id="previewFrameWrap" class="preview-frame-wrap">
          <iframe
            id="previewFrame"
            title="Disposable reader preview"
            sandbox="allow-scripts allow-modals"
            referrerpolicy="no-referrer"
          ></iframe>
        </div>
      </div>
    </div>
  </dialog>

  <script>
    (() => {
      "use strict";

      const visualEditor = document.getElementById("visualEditor");
      const sourceEditor = document.getElementById("sourceEditor");
      const visualModeBtn = document.getElementById("visualModeBtn");
      const sourceModeBtn = document.getElementById("sourceModeBtn");
      const toolbar = document.getElementById("toolbar");
      const filenameLabel = document.getElementById("filename");
      const status = document.getElementById("status");
      const count = document.getElementById("count");
      const fileInput = document.getElementById("fileInput");
      const folderInput = document.getElementById("folderInput");
      const imageInput = document.getElementById("imageInput");
      const saveBtn = document.getElementById("saveBtn");
      const outlinePanel = document.getElementById("outlinePanel");
      const outlineList = document.getElementById("outlineList");
      const outlineSearch = document.getElementById("outlineSearch");
      const outlineCount = document.getElementById("outlineCount");
      const outlineToggleBtn = document.getElementById("outlineToggleBtn");
      const diagnosticsPanel = document.getElementById("diagnosticsPanel");
      const diagnosticsSummary = document.getElementById("diagnosticsSummary");
      const diagnosticsList = document.getElementById("diagnosticsList");
      const saveReviewDialog = document.getElementById("saveReviewDialog");
      const saveReviewBody = document.getElementById("saveReviewBody");
      const backupSaveReviewBtn = document.getElementById("backupSaveReviewBtn");
      const confirmSaveReviewBtn = document.getElementById("confirmSaveReviewBtn");
      const textbookToolbar = document.getElementById("textbookToolbar");
      const textbookModeBadge = document.getElementById("textbookModeBadge");
      const structureDialog = document.getElementById("structureDialog");
      const structureDialogTitle = document.getElementById("structureDialogTitle");
      const structureForm = document.getElementById("structureForm");
      const structureFields = document.getElementById("structureFields");
      const structureHelp = document.getElementById("structureHelp");
      const insertStructureBtn = document.getElementById("insertStructureBtn");
      const previewDialog = document.getElementById("previewDialog");
      const previewFrame = document.getElementById("previewFrame");
      const previewFrameWrap = document.getElementById("previewFrameWrap");
      const previewReport = document.getElementById("previewReport");

      let currentMode = "visual";
      let currentFilename = "untitled.html";
      let currentDocumentPath = "";
      let projectRootName = "";
      let dirty = false;
      let storedDoctype = "<!doctype html>";
      let visualLoadSequence = 0;
      let projectDirectoryHandle = null;
      let currentFileHandle = null;
      let savedVisualRange = null;
      let saveInProgress = false;
      let baselineHtml = "";
      let countUpdateTimer = null;
      let outlineRefreshTimer = null;
      let outlineTargets = [];
      let pendingSaveReview = null;
      let textbookMode = false;
      let activeStructureType = "";
      let previewToken = "";
      let previewSequence = 0;
      let previewWidth = "desktop";
      let visualHistory = [];
      let visualHistoryIndex = -1;
      let historyCaptureTimer = null;
      let applyingHistory = false;
      let visualHistoryBaselineHtml = "";

      const projectFiles = new Map();
      const projectFileHandles = new Map();
      const projectFilesLower = new Map();
      const assetObjectUrls = new Map();
      const cssObjectUrls = new Map();
      const cssObjectUrlPromises = new Map();

      const starterDocument = `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Untitled document</title>
  <style>
    body {
      max-width: 760px;
      margin: 3rem auto;
      padding: 0 1.25rem;
      font: 18px/1.65 system-ui, sans-serif;
      color: #202124;
    }
    img { max-width: 100%; height: auto; }
    pre { overflow-x: auto; padding: 1rem; background: #f4f5f7; }
    blockquote { margin-left: 0; padding-left: 1rem; border-left: 4px solid #bbb; }
  </style>
</head>
<body>
  <h1>Start writing</h1>
  <p>Use <strong>Open Folder</strong> when the page refers to images or stylesheets stored beside the HTML file.</p>
</body>
</html>`;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle("danger", isError);
      }

      function markDirty(value = true) {
        dirty = value;
        document.title = `${dirty ? "• " : ""}${currentFilename} — Lightweight HTML Editor`;
        filenameLabel.textContent = `${dirty ? "• " : ""}${currentFilename}`;
      }

      function updateSaveButton() {
        const canWriteDirectly = Boolean(currentFileHandle?.createWritable);
        saveBtn.textContent = canWriteDirectly ? "Save HTML" : "Download HTML";
        saveBtn.title = canWriteDirectly
          ? `Save directly back to ${currentFilename}`
          : "Download the current HTML; your browser cannot write directly to the opened file";
      }

      function setCurrentFileHandle(handle = null) {
        currentFileHandle = handle;
        updateSaveButton();
      }

      function confirmDiscardUnsaved(action) {
        return !dirty || confirm(`Discard unsaved changes and ${action}?`);
      }

      function extractDoctype(html) {
        const match = html.match(/^\s*(<!doctype[^>]*>)/i);
        return match ? match[1] : "<!doctype html>";
      }

      function editorDocument() {
        return visualEditor.contentDocument;
      }

      function normalisePath(path) {
        const output = [];
        String(path || "").replace(/\\/g, "/").split("/").forEach(part => {
          if (!part || part === ".") return;
          if (part === "..") output.pop();
          else output.push(part);
        });
        return output.join("/");
      }

      function dirname(path) {
        const normalised = normalisePath(path);
        const index = normalised.lastIndexOf("/");
        return index === -1 ? "" : normalised.slice(0, index);
      }

      function basename(path) {
        const normalised = normalisePath(path);
        return normalised.slice(normalised.lastIndexOf("/") + 1);
      }

      function relativePath(fromDirectory, targetPath) {
        const fromParts = normalisePath(fromDirectory).split("/").filter(Boolean);
        const targetParts = normalisePath(targetPath).split("/").filter(Boolean);
        let common = 0;
        while (
          common < fromParts.length &&
          common < targetParts.length &&
          fromParts[common].toLowerCase() === targetParts[common].toLowerCase()
        ) {
          common += 1;
        }
        const parts = [
          ...Array(fromParts.length - common).fill(".."),
          ...targetParts.slice(common)
        ];
        return parts.join("/") || basename(targetPath);
      }

      function escapeAttribute(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function safeFilename(name) {
        const cleaned = String(name || "image")
          .replace(/[\\/:*?"<>|\x00-\x1f]/g, "-")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^[-.]+|[-.]+$/g, "");
        return cleaned || "image";
      }

      function validateProjectPath(value) {
        const raw = String(value || "").trim().replace(/\\/g, "/");
        if (!raw || raw.startsWith("/") || /^[a-z]:\//i.test(raw)) return "";
        const parts = raw.split("/").filter(Boolean);
        if (!parts.length || parts.some(part => part === "..")) return "";
        return normalisePath(parts.join("/"));
      }

      function stripQueryAndHash(value) {
        return String(value || "").split(/[?#]/, 1)[0];
      }

      function safeDecode(value) {
        try { return decodeURIComponent(value); }
        catch { return value; }
      }

      function isLocalReference(value) {
        const trimmed = String(value || "").trim();
        return Boolean(trimmed) &&
          !trimmed.startsWith("#") &&
          !trimmed.startsWith("//") &&
          !/^[a-z][a-z0-9+.-]*:/i.test(trimmed);
      }

      function resolveProjectPath(reference, baseDocumentPath = currentDocumentPath) {
        if (!isLocalReference(reference)) return "";
        let pathPart = safeDecode(stripQueryAndHash(reference).trim());
        if (!pathPart) return "";
        if (pathPart.startsWith("/")) return normalisePath(pathPart.slice(1));
        return normalisePath(`${dirname(baseDocumentPath)}/${pathPart}`);
      }

      function getProjectFile(path) {
        const normalised = normalisePath(path);
        return projectFiles.get(normalised) || projectFilesLower.get(normalised.toLowerCase()) || null;
      }

      function registerProjectFile(path, file, handle = null) {
        const normalised = normalisePath(path);
        const oldUrl = assetObjectUrls.get(normalised);
        if (oldUrl) {
          URL.revokeObjectURL(oldUrl);
          assetObjectUrls.delete(normalised);
        }
        projectFiles.set(normalised, file);
        projectFilesLower.set(normalised.toLowerCase(), file);
        if (handle) projectFileHandles.set(normalised, handle);
        return normalised;
      }

      function revokeProjectUrls() {
        for (const url of assetObjectUrls.values()) URL.revokeObjectURL(url);
        for (const url of cssObjectUrls.values()) URL.revokeObjectURL(url);
        assetObjectUrls.clear();
        cssObjectUrls.clear();
        cssObjectUrlPromises.clear();
      }

      function clearProject() {
        revokeProjectUrls();
        projectFiles.clear();
        projectFilesLower.clear();
        projectFileHandles.clear();
        projectDirectoryHandle = null;
        setCurrentFileHandle(null);
        currentDocumentPath = "";
        projectRootName = "";
      }

      function getAssetObjectUrl(path) {
        const normalised = normalisePath(path);
        const file = getProjectFile(normalised);
        if (!file) return "";
        if (!assetObjectUrls.has(normalised)) {
          assetObjectUrls.set(normalised, URL.createObjectURL(file));
        }
        return assetObjectUrls.get(normalised);
      }

      async function asyncReplace(text, regex, replacer) {
        const matches = [...text.matchAll(regex)];
        if (!matches.length) return text;
        let result = "";
        let position = 0;
        for (const match of matches) {
          result += text.slice(position, match.index);
          result += await replacer(...match);
          position = match.index + match[0].length;
        }
        return result + text.slice(position);
      }

      async function getCssObjectUrl(path, ancestry = new Set()) {
        const normalised = normalisePath(path);
        if (cssObjectUrls.has(normalised)) return cssObjectUrls.get(normalised);
        if (cssObjectUrlPromises.has(normalised)) return cssObjectUrlPromises.get(normalised);

        const file = getProjectFile(normalised);
        if (!file) return "";
        if (ancestry.has(normalised)) return getAssetObjectUrl(normalised);

        const promise = (async () => {
          const nextAncestry = new Set(ancestry);
          nextAncestry.add(normalised);
          const css = await file.text();
          const rewritten = await rewriteCssText(css, normalised, nextAncestry);
          const blob = new Blob([rewritten.css], { type: "text/css;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          cssObjectUrls.set(normalised, url);
          return url;
        })();

        cssObjectUrlPromises.set(normalised, promise);
        try { return await promise; }
        finally { cssObjectUrlPromises.delete(normalised); }
      }

      async function rewriteCssText(css, basePath, ancestry = new Set()) {
        const replacements = [];

        let output = await asyncReplace(
          css,
          /url\(\s*(["']?)(.*?)\1\s*\)/gi,
          async (whole, quote, rawReference) => {
            const reference = rawReference.trim();
            const resolved = resolveProjectPath(reference, basePath);
            const file = resolved && getProjectFile(resolved);
            if (!file) return whole;

            const isCss = /\.css$/i.test(stripQueryAndHash(reference)) || file.type === "text/css";
            const replacement = isCss
              ? await getCssObjectUrl(resolved, ancestry)
              : getAssetObjectUrl(resolved);
            if (!replacement) return whole;

            replacements.push([replacement, reference]);
            return `url("${replacement}")`;
          }
        );

        output = await asyncReplace(
          output,
          /@import\s+(["'])(.*?)\1/gi,
          async (whole, quote, rawReference) => {
            const reference = rawReference.trim();
            const resolved = resolveProjectPath(reference, basePath);
            if (!resolved || !getProjectFile(resolved)) return whole;
            const replacement = await getCssObjectUrl(resolved, ancestry);
            if (!replacement) return whole;
            replacements.push([replacement, reference]);
            return `@import url("${replacement}")`;
          }
        );

        return { css: output, replacements };
      }

      function recordOriginalAttribute(element, attribute, original) {
        element.setAttribute(`data-lw-original-${attribute}`, original);
      }

      async function rewriteAttribute(element, attribute, basePath, useCssLoader = false) {
        const original = element.getAttribute(attribute);
        const resolved = resolveProjectPath(original, basePath);
        if (!resolved || !getProjectFile(resolved)) return;
        const replacement = useCssLoader
          ? await getCssObjectUrl(resolved)
          : getAssetObjectUrl(resolved);
        if (!replacement) return;
        recordOriginalAttribute(element, attribute, original);
        element.setAttribute(attribute, replacement);
      }

      function splitSrcset(srcset) {
        return srcset.split(",").map(candidate => candidate.trim()).filter(Boolean);
      }

      async function rewriteSrcset(element, basePath) {
        const original = element.getAttribute("srcset");
        if (!original) return;
        let changed = false;
        const candidates = splitSrcset(original).map(candidate => {
          const match = candidate.match(/^(\S+)(\s+.*)?$/);
          if (!match) return candidate;
          const reference = match[1];
          const resolved = resolveProjectPath(reference, basePath);
          const replacement = resolved && getAssetObjectUrl(resolved);
          if (!replacement) return candidate;
          changed = true;
          return `${replacement}${match[2] || ""}`;
        });
        if (changed) {
          recordOriginalAttribute(element, "srcset", original);
          element.setAttribute("srcset", candidates.join(", "));
        }
      }

      async function prepareHtmlForVisual(html) {
        storedDoctype = extractDoctype(html);
        const parsed = new DOMParser().parseFromString(html, "text/html");
        const basePath = currentDocumentPath;

        if (parsed.body) {
          if (parsed.body.hasAttribute("contenteditable")) {
            parsed.body.setAttribute(
              "data-lw-original-contenteditable",
              parsed.body.getAttribute("contenteditable")
            );
          } else {
            parsed.body.setAttribute("data-lw-remove-contenteditable", "");
          }
        }

        if (!projectFiles.size) {
          return `${storedDoctype}\n${parsed.documentElement.outerHTML}`;
        }

        const ordinaryAttributes = [
          ["img[src]", "src"],
          ["source[src]", "src"],
          ["video[src]", "src"],
          ["video[poster]", "poster"],
          ["audio[src]", "src"],
          ["track[src]", "src"],
          ["iframe[src]", "src"],
          ["embed[src]", "src"],
          ["object[data]", "data"],
          ["input[type='image'][src]", "src"],
          ["image[href]", "href"],
          ["link[rel~='icon'][href]", "href"]
        ];

        for (const [selector, attribute] of ordinaryAttributes) {
          for (const element of parsed.querySelectorAll(selector)) {
            await rewriteAttribute(element, attribute, basePath);
          }
        }

        for (const element of parsed.querySelectorAll("img[srcset], source[srcset]")) {
          await rewriteSrcset(element, basePath);
        }

        for (const link of parsed.querySelectorAll("link[rel~='stylesheet'][href]")) {
          await rewriteAttribute(link, "href", basePath, true);
        }

        for (const element of parsed.querySelectorAll("[style]")) {
          const original = element.getAttribute("style");
          const rewritten = await rewriteCssText(original, basePath);
          if (rewritten.replacements.length) {
            element.setAttribute("style", rewritten.css);
            element.setAttribute("data-lw-css-map", JSON.stringify(rewritten.replacements));
          }
        }

        for (const styleElement of parsed.querySelectorAll("style")) {
          const rewritten = await rewriteCssText(styleElement.textContent || "", basePath);
          if (rewritten.replacements.length) {
            styleElement.textContent = rewritten.css;
            styleElement.setAttribute("data-lw-css-map", JSON.stringify(rewritten.replacements));
          }
        }

        return `${storedDoctype}\n${parsed.documentElement.outerHTML}`;
      }

      function restoreCssMappings(element, getText, setText) {
        const encoded = element.getAttribute("data-lw-css-map");
        if (!encoded) return;
        try {
          let value = getText();
          const replacements = JSON.parse(encoded);
          for (const [replacement, original] of replacements) {
            value = value.split(replacement).join(original);
          }
          setText(value);
        } catch {
          // Leave the current CSS untouched if the internal map was damaged.
        }
        element.removeAttribute("data-lw-css-map");
      }

      const machineOwnedSelectors = [
        "#toc-list",
        "#mobile-toc-list",
        "#figure-index",
        "#table-index"
      ];

      function elementForNode(node) {
        if (!node) return null;
        return node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      }

      function lockMachineOwnedSections(doc) {
        let locked = 0;
        for (const element of doc.querySelectorAll(machineOwnedSelectors.join(","))) {
          if (element.hasAttribute("data-lw-editor-lock")) continue;
          element.setAttribute(
            "data-lw-editor-lock",
            element.hasAttribute("contenteditable")
              ? element.getAttribute("contenteditable")
              : "__missing__"
          );
          element.setAttribute("contenteditable", "false");
          locked += 1;
        }
        return locked;
      }

      function restoreMachineOwnedSections(root) {
        for (const element of root.querySelectorAll("[data-lw-editor-lock]")) {
          const original = element.getAttribute("data-lw-editor-lock");
          if (original === "__missing__") element.removeAttribute("contenteditable");
          else element.setAttribute("contenteditable", original);
          element.removeAttribute("data-lw-editor-lock");
        }
      }

      function cleanedVisualDocumentHtml() {
        const doc = editorDocument();
        if (!doc?.documentElement) return sourceEditor.value || starterDocument;
        const clone = doc.documentElement.cloneNode(true);

        const attributes = ["src", "srcset", "href", "poster", "data"];
        for (const attribute of attributes) {
          const marker = `data-lw-original-${attribute}`;
          for (const element of clone.querySelectorAll(`[${marker}]`)) {
            element.setAttribute(attribute, element.getAttribute(marker));
            element.removeAttribute(marker);
          }
        }

        for (const element of clone.querySelectorAll("[data-lw-css-map]")) {
          if (element.tagName.toLowerCase() === "style") {
            restoreCssMappings(
              element,
              () => element.textContent || "",
              value => { element.textContent = value; }
            );
          } else {
            restoreCssMappings(
              element,
              () => element.getAttribute("style") || "",
              value => { element.setAttribute("style", value); }
            );
          }
        }

        const body = clone.querySelector("body");
        if (body?.hasAttribute("data-lw-original-contenteditable")) {
          body.setAttribute("contenteditable", body.getAttribute("data-lw-original-contenteditable"));
          body.removeAttribute("data-lw-original-contenteditable");
        } else if (body?.hasAttribute("data-lw-remove-contenteditable")) {
          body.removeAttribute("contenteditable");
          body.removeAttribute("data-lw-remove-contenteditable");
        }

        restoreMachineOwnedSections(clone);

        for (const element of clone.querySelectorAll("[data-lw-caret-format]")) {
          if (!element.textContent && !element.children.length) element.remove();
          else element.removeAttribute("data-lw-caret-format");
        }

        for (const element of clone.querySelectorAll("*")) {
          for (const attribute of [...element.attributes]) {
            if (attribute.name.startsWith("data-lw-")) element.removeAttribute(attribute.name);
          }
        }

        return `${storedDoctype}\n${clone.outerHTML}`;
      }

      function enableEditing(loadSequence) {
        if (loadSequence !== visualLoadSequence) return;
        try {
          const doc = editorDocument();
          if (!doc) return;
          doc.designMode = "on";
          doc.body?.setAttribute("contenteditable", "true");
          const lockedCount = lockMachineOwnedSections(doc);
          updateTextbookMode(doc);
          resetVisualHistory(doc);
          updateFormattingToolbarState(doc);

          doc.addEventListener("beforeinput", event => {
            if (elementForNode(event.target)?.closest?.("[data-lw-editor-lock]")) {
              event.preventDefault();
              setStatus("That section is generated automatically. Edit the relevant heading, figure or table instead.", true);
              return;
            }
            if (event.inputType === "historyUndo" || event.inputType === "historyRedo") {
              event.preventDefault();
              changeVisualHistory(event.inputType === "historyUndo" ? -1 : 1);
              return;
            }
            const inputCommands = {
              formatBold: "bold",
              formatItalic: "italic",
              formatUnderline: "underline",
              formatStrikeThrough: "strikeThrough",
              insertUnorderedList: "insertUnorderedList",
              insertOrderedList: "insertOrderedList"
            };
            if (inputCommands[event.inputType]) {
              event.preventDefault();
              formatCommand(inputCommands[event.inputType]);
            }
          });

          doc.addEventListener("input", () => {
            normaliseEmptyFormattingCaret(doc);
            markDirty();
            scheduleCountUpdate();
            scheduleOutlineRefresh();
            scheduleVisualHistoryCapture(doc);
          });

          doc.addEventListener("selectionchange", () => {
            const selection = doc.getSelection();
            if (selection?.rangeCount) {
              const range = selection.getRangeAt(0);
              if (doc.body?.contains(range.commonAncestorContainer)) {
                savedVisualRange = range.cloneRange();
              }
            }
            updateOutlineActive(doc);
            updateFormattingToolbarState(doc);
          });
          doc.addEventListener("keydown", event => {
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
              event.preventDefault();
              saveFile();
              return;
            }
            if ((event.ctrlKey || event.metaKey) && !event.altKey && event.key.toLowerCase() === "z") {
              event.preventDefault();
              changeVisualHistory(event.shiftKey ? 1 : -1);
              return;
            }
            if ((event.ctrlKey || event.metaKey) && !event.altKey && event.key.toLowerCase() === "y") {
              event.preventDefault();
              changeVisualHistory(1);
              return;
            }
            if ((event.ctrlKey || event.metaKey) && !event.altKey && ["b", "i", "u"].includes(event.key.toLowerCase())) {
              event.preventDefault();
              const command = { b: "bold", i: "italic", u: "underline" }[event.key.toLowerCase()];
              formatCommand(command);
            }
          });

          updateCount();
          refreshOutline(doc);
          const assetNote = projectFiles.size
            ? ` Local assets loaded from ${projectRootName || "the selected folder"}.`
            : "";
          const lockNote = lockedCount
            ? ` ${lockedCount} generated contents/index section${lockedCount === 1 ? " is" : "s are"} protected.`
            : "";
          const saveNote = currentFileHandle?.createWritable
            ? " Direct save is available."
            : " Saving will download a replacement file.";
          const textbookNote = textbookMode ? " Textbook mode detected." : "";
          setStatus(`Visual editor ready.${textbookNote}${assetNote}${lockNote}${saveNote} Scripts are preserved but not executed.`);
        } catch (error) {
          setStatus(`Could not initialise visual editing: ${error.message}`, true);
        }
      }

      async function loadVisual(html) {
        savedVisualRange = null;
        const sequence = ++visualLoadSequence;
        setStatus(projectFiles.size ? "Resolving local images and stylesheets" : "Loading visual editor");
        try {
          const preparedHtml = await prepareHtmlForVisual(html);
          if (sequence !== visualLoadSequence) return;
          visualEditor.onload = () => enableEditing(sequence);
          visualEditor.srcdoc = preparedHtml;
        } catch (error) {
          setStatus(`Could not prepare the page: ${error.message}`, true);
        }
      }

      function visualHTML() {
        return cleanedVisualDocumentHtml();
      }

      async function switchMode(mode) {
        if (mode === currentMode) return;

        if (mode === "source") {
          sourceEditor.value = visualHTML();
          visualEditor.classList.add("hidden");
          sourceEditor.classList.remove("hidden");
          toolbar.querySelectorAll("button, select").forEach(el => el.disabled = true);
          sourceModeBtn.classList.add("active");
          visualModeBtn.classList.remove("active");
          currentMode = "source";
          updateTextbookMode(new DOMParser().parseFromString(sourceEditor.value, "text/html"));
          sourceEditor.focus();
          updateCount();
          showOutlineMessage("Return to Visual mode to use the outline.");
          setStatus("Editing HTML source");
        } else {
          const html = sourceEditor.value.trim() || starterDocument;
          storedDoctype = extractDoctype(html);
          sourceEditor.classList.add("hidden");
          visualEditor.classList.remove("hidden");
          toolbar.querySelectorAll("button, select").forEach(el => el.disabled = false);
          sourceModeBtn.classList.remove("active");
          visualModeBtn.classList.add("active");
          currentMode = "visual";
          updateTextbookMode(new DOMParser().parseFromString(html, "text/html"));
          await loadVisual(html);
        }
      }

      const formattingBlockSelector = "p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,td,th,figcaption,summary";
      const inlineCommandTags = {
        bold: ["strong", "b"],
        italic: ["em", "i"],
        underline: ["u"],
        strikeThrough: ["s", "strike"]
      };

      function selectionNodePath(root, node) {
        const path = [];
        let current = node;
        while (current && current !== root) {
          const parent = current.parentNode;
          if (!parent) return null;
          path.unshift([...parent.childNodes].indexOf(current));
          current = parent;
        }
        return current === root ? path : null;
      }

      function nodeAtSelectionPath(root, path) {
        let current = root;
        for (const index of path || []) {
          current = current?.childNodes?.[index];
          if (!current) return null;
        }
        return current;
      }

      function visualSelectionBookmark(doc) {
        const range = getSavedVisualRange(doc);
        if (!range || !doc.body.contains(range.commonAncestorContainer)) return null;
        const startPath = selectionNodePath(doc.body, range.startContainer);
        const endPath = selectionNodePath(doc.body, range.endContainer);
        if (!startPath || !endPath) return null;
        return {
          startPath,
          startOffset: range.startOffset,
          endPath,
          endOffset: range.endOffset
        };
      }

      function clampRangeOffset(node, offset) {
        const maximum = node.nodeType === 3 ? node.data.length : node.childNodes.length;
        return Math.max(0, Math.min(Number(offset) || 0, maximum));
      }

      function restoreVisualBookmark(doc, bookmark) {
        if (!bookmark) return null;
        const start = nodeAtSelectionPath(doc.body, bookmark.startPath);
        const end = nodeAtSelectionPath(doc.body, bookmark.endPath);
        if (!start || !end) return null;
        try {
          const range = doc.createRange();
          range.setStart(start, clampRangeOffset(start, bookmark.startOffset));
          range.setEnd(end, clampRangeOffset(end, bookmark.endOffset));
          return restoreVisualRange(doc, range);
        } catch {
          return null;
        }
      }

      function visualHistoryEntry(doc) {
        return { html: doc.body.innerHTML, selection: visualSelectionBookmark(doc) };
      }

      function updateHistoryButtons() {
        const undo = toolbar.querySelector("button[data-command='undo']");
        const redo = toolbar.querySelector("button[data-command='redo']");
        if (undo) undo.disabled = currentMode !== "visual" || visualHistoryIndex <= 0;
        if (redo) redo.disabled = currentMode !== "visual" || visualHistoryIndex >= visualHistory.length - 1;
      }

      function resetVisualHistory(doc) {
        clearTimeout(historyCaptureTimer);
        historyCaptureTimer = null;
        visualHistory = [visualHistoryEntry(doc)];
        visualHistoryIndex = 0;
        visualHistoryBaselineHtml = visualHistory[0].html;
        updateHistoryButtons();
      }

      function commitVisualHistory(doc = editorDocument()) {
        if (applyingHistory || currentMode !== "visual" || !doc?.body) return;
        clearTimeout(historyCaptureTimer);
        historyCaptureTimer = null;
        const entry = visualHistoryEntry(doc);
        const current = visualHistory[visualHistoryIndex];
        if (current?.html === entry.html) {
          current.selection = entry.selection;
          updateHistoryButtons();
          return;
        }
        visualHistory.splice(visualHistoryIndex + 1);
        visualHistory.push(entry);
        if (visualHistory.length > 20) visualHistory.shift();
        visualHistoryIndex = visualHistory.length - 1;
        updateHistoryButtons();
      }

      function scheduleVisualHistoryCapture(doc = editorDocument()) {
        if (applyingHistory || currentMode !== "visual") return;
        clearTimeout(historyCaptureTimer);
        historyCaptureTimer = setTimeout(() => commitVisualHistory(doc), 450);
      }

      function acceptVisualHistoryBaseline() {
        if (currentMode === "visual") visualHistoryBaselineHtml = editorDocument()?.body?.innerHTML || "";
      }

      function changeVisualHistory(direction) {
        if (currentMode !== "visual") return;
        const doc = editorDocument();
        commitVisualHistory(doc);
        const next = visualHistoryIndex + direction;
        if (next < 0 || next >= visualHistory.length) {
          setStatus(direction < 0 ? "Nothing to undo." : "Nothing to redo.");
          return;
        }
        applyingHistory = true;
        try {
          visualHistoryIndex = next;
          doc.body.innerHTML = visualHistory[next].html;
          lockMachineOwnedSections(doc);
          restoreVisualBookmark(doc, visualHistory[next].selection);
          refreshOutline(doc);
          updateCount();
          markDirty(doc.body.innerHTML !== visualHistoryBaselineHtml);
          setStatus(direction < 0 ? "Undid the last edit." : "Redid the edit.");
        } finally {
          applyingHistory = false;
          updateHistoryButtons();
        }
      }

      function editableVisualRange(doc) {
        const range = getSavedVisualRange(doc);
        if (!range || !doc.body?.contains(range.commonAncestorContainer)) return null;
        const start = elementForNode(range.startContainer);
        const end = elementForNode(range.endContainer);
        if (start?.closest("[data-lw-editor-lock]") || end?.closest("[data-lw-editor-lock]")) return null;
        return range;
      }

      function selectionMarkers(doc, range) {
        const collapsed = range.collapsed;
        let end = null;
        if (!collapsed) {
          end = doc.createElement("span");
          end.dataset.lwSelectionMarker = "end";
          const endRange = range.cloneRange();
          endRange.collapse(false);
          endRange.insertNode(end);
        }
        const start = doc.createElement("span");
        start.dataset.lwSelectionMarker = "start";
        const startRange = range.cloneRange();
        startRange.collapse(true);
        startRange.insertNode(start);
        return { start, end, collapsed };
      }

      function rangeBetweenMarkers(doc, markers) {
        const range = doc.createRange();
        if (markers.end) {
          range.setStartAfter(markers.start);
          range.setEndBefore(markers.end);
        } else {
          range.setStartBefore(markers.start);
          range.collapse(true);
        }
        return range;
      }

      function restoreFromSelectionMarkers(doc, markers) {
        const range = rangeBetweenMarkers(doc, markers);
        markers.start.remove();
        markers.end?.remove();
        return restoreVisualRange(doc, range);
      }

      function unwrapElement(element) {
        element.replaceWith(...element.childNodes);
      }

      function closestFormattingBlock(node) {
        return elementForNode(node)?.closest(formattingBlockSelector) || null;
      }

      function blocksBetweenMarkers(doc, markers) {
        if (markers.collapsed) {
          const block = closestFormattingBlock(markers.start);
          return block ? [block] : [];
        }
        const range = rangeBetweenMarkers(doc, markers);
        const blocks = [];
        const walker = doc.createTreeWalker(doc.body, 4);
        let node;
        while ((node = walker.nextNode())) {
          if (!node.data || !range.intersectsNode(node)) continue;
          const block = closestFormattingBlock(node);
          if (block && !blocks.includes(block)) blocks.push(block);
        }
        if (!blocks.length) {
          const startBlock = closestFormattingBlock(markers.start);
          if (startBlock) blocks.push(startBlock);
        }
        return blocks;
      }

      function normaliseEmptyFormattingCaret(doc) {
        for (const element of doc.querySelectorAll("[data-lw-caret-format]")) {
          if (element.textContent || element.children.length) element.removeAttribute("data-lw-caret-format");
        }
      }

      function finishFormattingMutation(doc, message = "Formatting applied.") {
        normaliseEmptyFormattingCaret(doc);
        markDirty();
        scheduleCountUpdate();
        scheduleOutlineRefresh();
        commitVisualHistory(doc);
        updateFormattingToolbarState(doc);
        setStatus(message);
      }

      function runRangeMutation(mutator, message) {
        if (currentMode !== "visual") return false;
        const doc = editorDocument();
        const range = editableVisualRange(doc);
        if (!range) {
          setStatus("Place the cursor in editable document content first.", true);
          return false;
        }
        commitVisualHistory(doc);
        const before = doc.body.innerHTML;
        const bookmark = visualSelectionBookmark(doc);
        const markers = selectionMarkers(doc, range);
        try {
          mutator(doc, markers);
          restoreFromSelectionMarkers(doc, markers);
        } catch (error) {
          doc.body.innerHTML = before;
          lockMachineOwnedSections(doc);
          restoreVisualBookmark(doc, bookmark);
          setStatus(error.message || "Formatting could not be applied to that selection.", true);
          return false;
        }
        if (doc.body.innerHTML === before) return false;
        finishFormattingMutation(doc, message);
        return true;
      }

      function toggleInlineFormatting(command) {
        const tags = inlineCommandTags[command];
        const preferred = { bold: "strong", italic: "em", underline: "u", strikeThrough: "s" }[command];
        const selector = tags.join(",");
        runRangeMutation((doc, markers) => {
          const existing = markers.start.parentElement?.closest(selector);
          if (markers.collapsed) {
            if (existing && doc.body.contains(existing)) {
              unwrapElement(existing);
            } else {
              const wrapper = doc.createElement(preferred);
              wrapper.dataset.lwCaretFormat = command;
              markers.start.replaceWith(wrapper);
              wrapper.appendChild(markers.start);
            }
            return;
          }

          const endExisting = markers.end?.parentElement?.closest(selector);
          if (existing && existing === endExisting) {
            unwrapElement(existing);
            return;
          }
          const startBlock = closestFormattingBlock(markers.start);
          const endBlock = closestFormattingBlock(markers.end);
          if (!startBlock || startBlock !== endBlock) {
            throw new Error("Apply inline formatting within one paragraph or heading at a time.");
          }
          const range = rangeBetweenMarkers(doc, markers);
          const fragment = range.extractContents();
          fragment.querySelectorAll(selector).forEach(unwrapElement);
          const wrapper = doc.createElement(preferred);
          wrapper.appendChild(fragment);
          range.insertNode(wrapper);
        }, `${command === "strikeThrough" ? "Strikethrough" : command[0].toUpperCase() + command.slice(1)} formatting applied.`);
      }

      function formatSelectedBlocks(tagName) {
        const allowed = new Set(["p", "h1", "h2", "h3", "h4", "blockquote", "pre"]);
        const wanted = String(tagName || "").toLowerCase();
        if (!allowed.has(wanted)) return;
        runRangeMutation((doc, markers) => {
          const blocks = blocksBetweenMarkers(doc, markers);
          if (!blocks.length) throw new Error("Place the cursor in a paragraph or heading first.");
          for (const block of blocks) {
            if (!allowed.has(block.tagName.toLowerCase())) {
              throw new Error("Block styles cannot replace list items, table cells, captions or summaries.");
            }
            if (block.tagName.toLowerCase() === wanted) continue;
            const replacement = doc.createElement(wanted);
            for (const attribute of [...block.attributes]) replacement.setAttribute(attribute.name, attribute.value);
            replacement.append(...block.childNodes);
            block.replaceWith(replacement);
          }
        }, `Changed block style to ${wanted.toUpperCase()}.`);
      }

      function alignSelectedBlocks(alignment) {
        runRangeMutation((doc, markers) => {
          const blocks = blocksBetweenMarkers(doc, markers);
          if (!blocks.length) throw new Error("Place the cursor in a text block first.");
          blocks.forEach(block => {
            block.style.textAlign = alignment;
            if (!block.getAttribute("style")) block.removeAttribute("style");
          });
        }, `Aligned text ${alignment}.`);
      }

      function clearSelectedFormatting() {
        const removable = "strong,b,em,i,u,s,strike,font,span[style]";
        runRangeMutation((doc, markers) => {
          if (markers.collapsed) {
            let current = markers.start.parentElement?.closest(removable);
            while (current && doc.body.contains(current)) {
              const parent = current.parentElement;
              unwrapElement(current);
              current = parent?.closest(removable) || null;
            }
            return;
          }
          const range = rangeBetweenMarkers(doc, markers);
          const fragment = range.extractContents();
          [...fragment.querySelectorAll(removable)].reverse().forEach(unwrapElement);
          fragment.querySelectorAll("[style]").forEach(element => element.removeAttribute("style"));
          range.insertNode(fragment);
        }, "Cleared inline formatting.");
      }

      function listItemsBetweenMarkers(doc, markers, list = null) {
        const range = rangeBetweenMarkers(doc, markers);
        const matches = [...(list || doc).querySelectorAll("li")].filter(item => {
          if (item.contains(markers.start) || item.contains(markers.end)) return true;
          try { return range.intersectsNode(item); }
          catch { return false; }
        });
        return matches.filter(item => !matches.some(other => other !== item && item.contains(other)));
      }

      function unwrapSelectedListItems(doc, list, selectedItems) {
        const allItems = [...list.children].filter(child => child.tagName === "LI");
        const selected = allItems.filter(item => selectedItems.includes(item));
        if (!selected.length) return;
        if (selected.some(item => item.querySelector(":scope > ul, :scope > ol"))) {
          throw new Error("Outdent nested list items before converting them to paragraphs.");
        }
        const lastIndex = allItems.indexOf(selected[selected.length - 1]);
        const afterItems = allItems.slice(lastIndex + 1);
        const afterList = afterItems.length ? list.cloneNode(false) : null;
        afterList?.removeAttribute("id");
        afterItems.forEach(item => afterList.appendChild(item));
        const fragment = doc.createDocumentFragment();
        selected.forEach(item => {
          const paragraph = doc.createElement("p");
          for (const attribute of [...item.attributes]) paragraph.setAttribute(attribute.name, attribute.value);
          paragraph.append(...item.childNodes);
          fragment.appendChild(paragraph);
          item.remove();
        });
        if (afterList) list.after(fragment, afterList);
        else list.after(fragment);
        if (!list.querySelector(":scope > li")) list.remove();
      }

      function toggleListFormatting(tagName) {
        runRangeMutation((doc, markers) => {
          const wanted = tagName.toLowerCase();
          const startList = markers.start.parentElement?.closest("ul,ol");
          const endList = markers.end?.parentElement?.closest("ul,ol") || startList;
          if (startList && startList === endList) {
            if (startList.tagName.toLowerCase() === wanted) {
              unwrapSelectedListItems(doc, startList, listItemsBetweenMarkers(doc, markers, startList));
            } else {
              const replacement = doc.createElement(wanted);
              for (const attribute of [...startList.attributes]) replacement.setAttribute(attribute.name, attribute.value);
              replacement.append(...startList.childNodes);
              startList.replaceWith(replacement);
            }
            return;
          }
          if (startList || endList) throw new Error("Convert or extend one list at a time.");

          const blocks = blocksBetweenMarkers(doc, markers);
          if (!blocks.length) throw new Error("Place the cursor in one or more paragraphs first.");
          if (blocks.some(block => !["P", "BLOCKQUOTE"].includes(block.tagName))) {
            throw new Error("Lists can be created from paragraphs or blockquotes, not headings or table content.");
          }
          const parent = blocks[0].parentElement;
          if (blocks.some(block => block.parentElement !== parent)) {
            throw new Error("The selected paragraphs must share one container.");
          }
          for (let index = 1; index < blocks.length; index += 1) {
            let sibling = blocks[index - 1].nextSibling;
            while (sibling?.nodeType === 3 && !sibling.data.trim()) sibling = sibling.nextSibling;
            if (sibling !== blocks[index]) throw new Error("Select adjacent paragraphs to make a list.");
          }
          const list = doc.createElement(wanted);
          parent.insertBefore(list, blocks[0]);
          blocks.forEach(block => {
            const item = doc.createElement("li");
            for (const attribute of [...block.attributes]) item.setAttribute(attribute.name, attribute.value);
            item.append(...block.childNodes);
            list.appendChild(item);
            block.remove();
          });
        }, tagName === "ul" ? "Toggled bulleted list." : "Toggled numbered list.");
      }

      function changeIndentation(direction) {
        runRangeMutation((doc, markers) => {
          const items = listItemsBetweenMarkers(doc, markers);
          if (items.length) {
            const list = items[0].parentElement;
            if (!list || !["UL", "OL"].includes(list.tagName) || items.some(item => item.parentElement !== list)) {
              throw new Error("Indent list items from one list at a time.");
            }
            if (direction > 0) {
              const previous = items[0].previousElementSibling;
              if (!previous?.matches("li")) throw new Error("The first list item cannot be indented.");
              let nested = [...previous.children].find(child => child.tagName === list.tagName);
              if (!nested) {
                nested = doc.createElement(list.tagName.toLowerCase());
                previous.appendChild(nested);
              }
              items.forEach(item => nested.appendChild(item));
              if (!list.querySelector(":scope > li")) list.remove();
              return;
            }
            const parentItem = list.parentElement?.closest("li");
            if (parentItem) {
              let reference = parentItem;
              items.forEach(item => {
                reference.after(item);
                reference = item;
              });
              if (!list.querySelector(":scope > li")) list.remove();
            } else {
              unwrapSelectedListItems(doc, list, items);
            }
            return;
          }

          const blocks = blocksBetweenMarkers(doc, markers);
          if (!blocks.length) throw new Error("Place the cursor in a text block first.");
          blocks.forEach(block => {
            const current = Number.parseFloat(block.style.marginInlineStart) || 0;
            const next = Math.max(0, current + direction * 32);
            if (next) block.style.marginInlineStart = `${next}px`;
            else block.style.removeProperty("margin-inline-start");
            if (!block.getAttribute("style")) block.removeAttribute("style");
          });
        }, direction > 0 ? "Indented selection." : "Outdented selection.");
      }

      function removeSelectedLinks() {
        runRangeMutation((doc, markers) => {
          if (markers.collapsed) {
            const link = markers.start.parentElement?.closest("a");
            if (!link) throw new Error("Place the cursor inside a link, or select linked text.");
            unwrapElement(link);
            return;
          }
          const range = rangeBetweenMarkers(doc, markers);
          const links = [...doc.querySelectorAll("a")].filter(link => {
            try { return range.intersectsNode(link); }
            catch { return false; }
          });
          if (!links.length) throw new Error("The selection contains no links.");
          links.forEach(unwrapElement);
        }, "Removed link formatting.");
      }

      function updateFormattingToolbarState(doc = editorDocument()) {
        if (currentMode !== "visual" || !doc) return;
        const range = getSavedVisualRange(doc);
        const anchor = elementForNode(range?.startContainer);
        for (const [command, tags] of Object.entries(inlineCommandTags)) {
          const button = toolbar.querySelector(`button[data-command='${command}']`);
          if (!button) continue;
          const active = Boolean(anchor?.closest(tags.join(",")));
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        }
      }

      function formatCommand(command, value = null) {
        if (command === "undo") return changeVisualHistory(-1);
        if (command === "redo") return changeVisualHistory(1);
        if (inlineCommandTags[command]) return toggleInlineFormatting(command);
        if (command === "formatBlock") return formatSelectedBlocks(value);
        if (command === "justifyLeft") return alignSelectedBlocks("left");
        if (command === "justifyCenter") return alignSelectedBlocks("center");
        if (command === "justifyRight") return alignSelectedBlocks("right");
        if (command === "removeFormat") return clearSelectedFormatting();
        if (command === "insertUnorderedList") return toggleListFormatting("ul");
        if (command === "insertOrderedList") return toggleListFormatting("ol");
        if (command === "indent") return changeIndentation(1);
        if (command === "outdent") return changeIndentation(-1);
        if (command === "unlink") return removeSelectedLinks();
      }

      function updateCount() {
        let text = "";
        if (currentMode === "visual") {
          text = editorDocument()?.body?.innerText || "";
        } else {
          const parsed = new DOMParser().parseFromString(sourceEditor.value, "text/html");
          text = parsed.body?.textContent || "";
        }

        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const chars = text.length;
        count.textContent = `${words.toLocaleString()} words · ${chars.toLocaleString()} characters`;
      }

      function scheduleCountUpdate(delay = 280) {
        clearTimeout(countUpdateTimer);
        countUpdateTimer = setTimeout(() => {
          countUpdateTimer = null;
          updateCount();
        }, delay);
      }

      function outlineHeadingText(heading) {
        const clone = heading.cloneNode(true);
        clone.querySelectorAll(".heading-anchor, .chapter-link").forEach(node => node.remove());
        return (clone.textContent || "").replace(/\s+/g, " ").trim() || "Untitled heading";
      }

      function showOutlineMessage(message) {
        outlineTargets = [];
        outlineList.replaceChildren();
        const empty = document.createElement("p");
        empty.className = "outline-empty";
        empty.textContent = message;
        outlineList.appendChild(empty);
        outlineCount.textContent = "0 headings";
      }

      function filterOutline() {
        const needle = outlineSearch.value.trim().toLowerCase();
        let visible = 0;
        for (const button of outlineList.querySelectorAll("button[data-outline-index]")) {
          const match = !needle || button.textContent.toLowerCase().includes(needle);
          button.hidden = !match;
          if (match) visible += 1;
        }
        outlineCount.textContent = needle
          ? `${visible} of ${outlineTargets.length}`
          : `${outlineTargets.length} heading${outlineTargets.length === 1 ? "" : "s"}`;
      }

      function refreshOutline(doc = editorDocument()) {
        if (currentMode !== "visual" || !doc?.body) {
          showOutlineMessage("Return to Visual mode to use the outline.");
          return;
        }

        let headings = [...doc.querySelectorAll("#article h2, #article h3")]
          .filter(heading => !heading.closest("figure, aside, details, #toc-list, #mobile-toc-list"));
        if (!headings.length) {
          headings = [...doc.querySelectorAll("body h1, body h2, body h3")]
            .filter(heading => !heading.closest("figure, aside, details"));
        }

        outlineTargets = headings;
        outlineList.replaceChildren();
        if (!headings.length) {
          showOutlineMessage("No navigable headings found.");
          return;
        }

        headings.forEach((heading, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `level-${Number(heading.tagName.slice(1))}`;
          button.dataset.outlineIndex = String(index);
          button.textContent = outlineHeadingText(heading);
          button.title = heading.id ? `Jump to #${heading.id}` : "Jump to this heading";
          outlineList.appendChild(button);
        });
        filterOutline();
        updateOutlineActive(doc);
      }

      function scheduleOutlineRefresh(delay = 650) {
        clearTimeout(outlineRefreshTimer);
        outlineRefreshTimer = setTimeout(() => {
          outlineRefreshTimer = null;
          refreshOutline();
        }, delay);
      }

      function updateOutlineActive(doc = editorDocument()) {
        if (currentMode !== "visual" || !outlineTargets.length || !doc) return;
        const selection = doc.getSelection();
        if (!selection?.rangeCount) return;
        const node = elementForNode(selection.anchorNode);
        if (!node) return;

        let activeIndex = -1;
        outlineTargets.forEach((heading, index) => {
          if (
            heading === node ||
            heading.contains(node) ||
            (heading.compareDocumentPosition(node) & 4)
          ) {
            activeIndex = index;
          }
        });
        outlineList.querySelectorAll("button[data-outline-index]").forEach(button => {
          button.classList.toggle("active", Number(button.dataset.outlineIndex) === activeIndex);
        });
      }

      function jumpToOutlineTarget(index) {
        const target = outlineTargets[index];
        const doc = editorDocument();
        if (!target || !doc?.body?.contains(target)) return;
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        const range = doc.createRange();
        range.selectNodeContents(target);
        range.collapse(false);
        restoreVisualRange(doc, range);
        updateOutlineActive(doc);
        setStatus(`Jumped to ${outlineHeadingText(target)}.`);
      }

      function setOutlineExpanded(expanded) {
        document.body.classList.toggle("outline-collapsed", !expanded);
        outlineToggleBtn.setAttribute("aria-expanded", String(expanded));
      }

      function isTextbookDocument(doc) {
        return Boolean(
          doc?.querySelector("article#article") &&
          doc.querySelector("section.chapter") &&
          doc.getElementById("toc-list") &&
          doc.getElementById("figure-index") &&
          doc.getElementById("table-index")
        );
      }

      function updateTextbookMode(doc = editorDocument()) {
        textbookMode = isTextbookDocument(doc);
        textbookToolbar.hidden = !textbookMode;
        textbookModeBadge.hidden = !textbookMode;
        textbookToolbar.querySelectorAll("button[data-structure]").forEach(button => {
          button.disabled = currentMode !== "visual";
        });
        document.getElementById("maintainTextbookBtn").disabled = !textbookMode;
      }

      function textbookSections(doc) {
        const article = doc.querySelector("article#article");
        if (!article) return [];
        return [...article.children].filter(element =>
          element.matches?.("section") && !element.classList.contains("footnotes")
        );
      }

      function cleanHeadingHtml(heading) {
        if (!heading) return "";
        const clone = heading.cloneNode(true);
        clone.querySelectorAll(".heading-anchor, .chapter-link").forEach(node => node.remove());
        return clone.innerHTML.trim();
      }

      function replaceLeadingText(element, pattern, replacement) {
        if (!element) return false;
        const walker = element.ownerDocument.createTreeWalker(element, 4);
        let node;
        while ((node = walker.nextNode())) {
          if (!pattern.test(node.data)) continue;
          const next = node.data.replace(pattern, replacement);
          if (next === node.data) return false;
          node.data = next;
          return true;
        }
        return false;
      }

      function sectionMaintenanceInfo(section, appendixIndex) {
        const classes = section.classList;
        const kind = classes.contains("part-divider") ? "part" :
          classes.contains("exercise") ? "exercise" :
          classes.contains("appendix") ? "appendix" :
          classes.contains("backsection") ? "backsection" :
          classes.contains("chapter") ? "chapter" : "other";
        const eyebrow = section.querySelector(":scope > .chapter-head .chapter-eyebrow, :scope > .chapter-eyebrow");
        const eyebrowText = eyebrow?.textContent.trim() || "";
        let label = null;
        if (kind === "appendix") label = String.fromCharCode(65 + appendixIndex);
        else if (kind === "chapter") {
          if (/^introduction/i.test(eyebrowText)) label = "0";
          else if (/^preface/i.test(eyebrowText)) label = "P";
          else label = eyebrowText.match(/^Chapter\s+(\d+)/i)?.[1] || "?";
        }
