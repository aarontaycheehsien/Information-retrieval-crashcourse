<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lightweight WYSIWYG HTML Editor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --panel: #ffffff;
      --panel-2: #f8f9fb;
      --text: #202124;
      --muted: #68707c;
      --border: #d9dde3;
      --accent: #2457d6;
      --accent-contrast: #ffffff;
      --danger: #b3261e;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191d;
        --panel: #202328;
        --panel-2: #262a30;
        --text: #f1f3f4;
        --muted: #aab1bb;
        --border: #3b414a;
        --accent: #8ab4f8;
        --accent-contrast: #10203d;
        --danger: #f28b82;
        --shadow: 0 1px 4px rgba(0,0,0,.35);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 3;
    }

    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
    }

    #filename {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      font-size: .86rem;
    }

    .spacer { flex: 1; }

    button, select, input[type="text"] {
      font: inherit;
    }

    button, select {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
    }

    button {
      padding: .35rem .65rem;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: var(--panel-2);
    }

    button:focus-visible, select:focus-visible, textarea:focus-visible, iframe:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 1px;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    .primary {
      background: var(--accent);
      color: var(--accent-contrast);
      border-color: transparent;
      font-weight: 650;
    }

    .primary:hover:not(:disabled) {
      filter: brightness(.96);
      background: var(--accent);
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: .35rem;
      padding: .5rem .75rem;
      overflow-x: auto;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      scrollbar-width: thin;
      z-index: 2;
    }

    #toolbar button {
      min-width: 34px;
      padding: .3rem .55rem;
      font-weight: 600;
    }

    #toolbar select {
      padding: .3rem .45rem;
      max-width: 145px;
    }

    .separator {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 .15rem;
      flex: 0 0 auto;
    }

    .mode-switch {
      display: inline-flex;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .mode-switch button {
      border: 0;
      min-height: 28px;
      padding: .25rem .65rem;
      background: transparent;
    }

    .mode-switch button.active {
      background: var(--panel);
      box-shadow: var(--shadow);
      color: var(--accent);
    }

    main {
      position: relative;
      min-height: 0;
      padding: .75rem;
      overflow: hidden;
    }

    .editor-shell {
      height: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    #visualEditor, #sourceEditor {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }

    #sourceEditor {
      resize: none;
      padding: 1rem;
      background: #111318;
      color: #e8eaed;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      tab-size: 2;
    }

    footer {
      display: flex;
      align-items: center;
      gap: .75rem;
      min-height: 32px;
      padding: .35rem .85rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: .8rem;
    }

    #status {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hidden { display: none !important; }

    .danger { color: var(--danger); }

    @media (max-width: 720px) {
      header h1 { display: none; }
      header { padding: .6rem .7rem; }
      main { padding: .45rem; }
      #toolbar { padding: .4rem; }
      #filename { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Lightweight HTML Editor</h1>
    <span id="filename">untitled.html</span>
    <div class="spacer"></div>

    <div class="mode-switch" aria-label="Editor mode">
      <button id="visualModeBtn" class="active" type="button">Visual</button>
      <button id="sourceModeBtn" type="button">Source</button>
    </div>

    <button id="newBtn" type="button">New</button>
    <button id="openBtn" type="button" title="Open one HTML file; Chrome and Edge can grant direct-save access">Open HTML</button>
    <button id="openFolderBtn" type="button" title="Open an HTML project folder with its images and stylesheets; Chrome and Edge can also grant write access">Open Folder</button>
    <button id="checkBtn" type="button" title="Check IDs, internal links, headings, local assets and footnotes">Check</button>
    <button id="saveBtn" class="primary" type="button" title="Download the current HTML">Download HTML</button>
    <input id="fileInput" type="file" accept=".html,.htm,text/html" hidden>
    <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
    <input id="imageInput" type="file" accept="image/*" hidden>
  </header>

  <div id="toolbar" aria-label="Formatting toolbar">
    <button type="button" data-command="undo" title="Undo">↶</button>
    <button type="button" data-command="redo" title="Redo">↷</button>
    <span class="separator"></span>

    <select id="blockFormat" title="Block style" aria-label="Block style">
      <option value="">Block style</option>
      <option value="p">Paragraph</option>
      <option value="h1">Heading 1</option>
      <option value="h2">Heading 2</option>
      <option value="h3">Heading 3</option>
      <option value="h4">Heading 4</option>
      <option value="blockquote">Blockquote</option>
      <option value="pre">Preformatted</option>
    </select>

    <button type="button" data-command="bold" title="Bold"><strong>B</strong></button>
    <button type="button" data-command="italic" title="Italic"><em>I</em></button>
    <button type="button" data-command="underline" title="Underline"><u>U</u></button>
    <button type="button" data-command="strikeThrough" title="Strikethrough"><s>S</s></button>
    <span class="separator"></span>

    <button type="button" data-command="insertUnorderedList" title="Bulleted list">• List</button>
    <button type="button" data-command="insertOrderedList" title="Numbered list">1. List</button>
    <button type="button" data-command="outdent" title="Outdent">⇤</button>
    <button type="button" data-command="indent" title="Indent">⇥</button>
    <span class="separator"></span>

    <button id="linkBtn" type="button" title="Insert link">Link</button>
    <button id="unlinkBtn" type="button" title="Remove link">Unlink</button>
    <button id="footnoteBtn" type="button" title="Insert a numbered footnote">Footnote</button>
    <button id="imageBtn" type="button" title="Insert an image using a relative file path">Image</button>
    <button id="hrBtn" type="button" title="Horizontal rule">Rule</button>
    <span class="separator"></span>

    <button type="button" data-command="justifyLeft" title="Align left">Left</button>
    <button type="button" data-command="justifyCenter" title="Align centre">Centre</button>
    <button type="button" data-command="justifyRight" title="Align right">Right</button>
    <span class="separator"></span>

    <button type="button" data-command="removeFormat" title="Clear inline formatting">Clear</button>
  </div>

  <main>
    <div class="editor-shell">
      <iframe
        id="visualEditor"
        title="Visual HTML editor"
        sandbox="allow-same-origin"
      ></iframe>
      <textarea
        id="sourceEditor"
        class="hidden"
        aria-label="HTML source editor"
        spellcheck="false"
      ></textarea>
    </div>
  </main>

  <footer>
    <span id="status">Ready</span>
    <div class="spacer"></div>
    <span id="count">0 words</span>
  </footer>

  <script>
    (() => {
      "use strict";

      const visualEditor = document.getElementById("visualEditor");
      const sourceEditor = document.getElementById("sourceEditor");
      const visualModeBtn = document.getElementById("visualModeBtn");
      const sourceModeBtn = document.getElementById("sourceModeBtn");
      const toolbar = document.getElementById("toolbar");
      const filenameLabel = document.getElementById("filename");
      const status = document.getElementById("status");
      const count = document.getElementById("count");
      const fileInput = document.getElementById("fileInput");
      const folderInput = document.getElementById("folderInput");
      const imageInput = document.getElementById("imageInput");
      const saveBtn = document.getElementById("saveBtn");

      let currentMode = "visual";
      let currentFilename = "untitled.html";
      let currentDocumentPath = "";
      let projectRootName = "";
      let dirty = false;
      let storedDoctype = "<!doctype html>";
      let visualLoadSequence = 0;
      let projectDirectoryHandle = null;
      let currentFileHandle = null;
      let savedVisualRange = null;
      let saveInProgress = false;

      const projectFiles = new Map();
      const projectFileHandles = new Map();
      const projectFilesLower = new Map();
      const assetObjectUrls = new Map();
      const cssObjectUrls = new Map();
      const cssObjectUrlPromises = new Map();

      const starterDocument = `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Untitled document</title>
  <style>
    body {
      max-width: 760px;
      margin: 3rem auto;
      padding: 0 1.25rem;
      font: 18px/1.65 system-ui, sans-serif;
      color: #202124;
    }
    img { max-width: 100%; height: auto; }
    pre { overflow-x: auto; padding: 1rem; background: #f4f5f7; }
    blockquote { margin-left: 0; padding-left: 1rem; border-left: 4px solid #bbb; }
  </style>
</head>
<body>
  <h1>Start writing</h1>
  <p>Use <strong>Open Folder</strong> when the page refers to images or stylesheets stored beside the HTML file.</p>
</body>
</html>`;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle("danger", isError);
      }

      function markDirty(value = true) {
        dirty = value;
        document.title = `${dirty ? "• " : ""}${currentFilename} — Lightweight HTML Editor`;
        filenameLabel.textContent = `${dirty ? "• " : ""}${currentFilename}`;
      }

      function updateSaveButton() {
        const canWriteDirectly = Boolean(currentFileHandle?.createWritable);
        saveBtn.textContent = canWriteDirectly ? "Save HTML" : "Download HTML";
        saveBtn.title = canWriteDirectly
          ? `Save directly back to ${currentFilename}`
          : "Download the current HTML; your browser cannot write directly to the opened file";
      }

      function setCurrentFileHandle(handle = null) {
        currentFileHandle = handle;
        updateSaveButton();
      }

      function confirmDiscardUnsaved(action) {
        return !dirty || confirm(`Discard unsaved changes and ${action}?`);
      }

      function extractDoctype(html) {
        const match = html.match(/^\s*(<!doctype[^>]*>)/i);
        return match ? match[1] : "<!doctype html>";
      }

      function editorDocument() {
        return visualEditor.contentDocument;
      }

      function normalisePath(path) {
        const output = [];
        String(path || "").replace(/\\/g, "/").split("/").forEach(part => {
          if (!part || part === ".") return;
          if (part === "..") output.pop();
          else output.push(part);
        });
        return output.join("/");
      }

      function dirname(path) {
        const normalised = normalisePath(path);
        const index = normalised.lastIndexOf("/");
        return index === -1 ? "" : normalised.slice(0, index);
      }

      function basename(path) {
        const normalised = normalisePath(path);
        return normalised.slice(normalised.lastIndexOf("/") + 1);
      }

      function relativePath(fromDirectory, targetPath) {
        const fromParts = normalisePath(fromDirectory).split("/").filter(Boolean);
        const targetParts = normalisePath(targetPath).split("/").filter(Boolean);
        let common = 0;
        while (
          common < fromParts.length &&
          common < targetParts.length &&
          fromParts[common].toLowerCase() === targetParts[common].toLowerCase()
        ) {
          common += 1;
        }
        const parts = [
          ...Array(fromParts.length - common).fill(".."),
          ...targetParts.slice(common)
        ];
        return parts.join("/") || basename(targetPath);
      }

      function escapeAttribute(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function safeFilename(name) {
        const cleaned = String(name || "image")
          .replace(/[\\/:*?"<>|\x00-\x1f]/g, "-")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^[-.]+|[-.]+$/g, "");
        return cleaned || "image";
      }

      function validateProjectPath(value) {
        const raw = String(value || "").trim().replace(/\\/g, "/");
        if (!raw || raw.startsWith("/") || /^[a-z]:\//i.test(raw)) return "";
        const parts = raw.split("/").filter(Boolean);
        if (!parts.length || parts.some(part => part === "..")) return "";
        return normalisePath(parts.join("/"));
      }

      function stripQueryAndHash(value) {
        return String(value || "").split(/[?#]/, 1)[0];
      }

      function safeDecode(value) {
        try { return decodeURIComponent(value); }
        catch { return value; }
      }

      function isLocalReference(value) {
        const trimmed = String(value || "").trim();
        return Boolean(trimmed) &&
          !trimmed.startsWith("#") &&
          !trimmed.startsWith("//") &&
          !/^[a-z][a-z0-9+.-]*:/i.test(trimmed);
      }

      function resolveProjectPath(reference, baseDocumentPath = currentDocumentPath) {
        if (!isLocalReference(reference)) return "";
        let pathPart = safeDecode(stripQueryAndHash(reference).trim());
        if (!pathPart) return "";
        if (pathPart.startsWith("/")) return normalisePath(pathPart.slice(1));
        return normalisePath(`${dirname(baseDocumentPath)}/${pathPart}`);
      }

      function getProjectFile(path) {
        const normalised = normalisePath(path);
        return projectFiles.get(normalised) || projectFilesLower.get(normalised.toLowerCase()) || null;
      }

      function registerProjectFile(path, file, handle = null) {
        const normalised = normalisePath(path);
        const oldUrl = assetObjectUrls.get(normalised);
        if (oldUrl) {
          URL.revokeObjectURL(oldUrl);
          assetObjectUrls.delete(normalised);
        }
        projectFiles.set(normalised, file);
        projectFilesLower.set(normalised.toLowerCase(), file);
        if (handle) projectFileHandles.set(normalised, handle);
        return normalised;
      }

      function revokeProjectUrls() {
        for (const url of assetObjectUrls.values()) URL.revokeObjectURL(url);
        for (const url of cssObjectUrls.values()) URL.revokeObjectURL(url);
        assetObjectUrls.clear();
        cssObjectUrls.clear();
        cssObjectUrlPromises.clear();
      }

      function clearProject() {
        revokeProjectUrls();
        projectFiles.clear();
        projectFilesLower.clear();
        projectFileHandles.clear();
        projectDirectoryHandle = null;
        setCurrentFileHandle(null);
        currentDocumentPath = "";
        projectRootName = "";
      }

      function getAssetObjectUrl(path) {
        const normalised = normalisePath(path);
        const file = getProjectFile(normalised);
        if (!file) return "";
        if (!assetObjectUrls.has(normalised)) {
          assetObjectUrls.set(normalised, URL.createObjectURL(file));
        }
        return assetObjectUrls.get(normalised);
      }

      async function asyncReplace(text, regex, replacer) {
        const matches = [...text.matchAll(regex)];
        if (!matches.length) return text;
        let result = "";
        let position = 0;
        for (const match of matches) {
          result += text.slice(position, match.index);
          result += await replacer(...match);
          position = match.index + match[0].length;
        }
        return result + text.slice(position);
      }

      async function getCssObjectUrl(path, ancestry = new Set()) {
        const normalised = normalisePath(path);
        if (cssObjectUrls.has(normalised)) return cssObjectUrls.get(normalised);
        if (cssObjectUrlPromises.has(normalised)) return cssObjectUrlPromises.get(normalised);

        const file = getProjectFile(normalised);
        if (!file) return "";
        if (ancestry.has(normalised)) return getAssetObjectUrl(normalised);

        const promise = (async () => {
          const nextAncestry = new Set(ancestry);
          nextAncestry.add(normalised);
          const css = await file.text();
          const rewritten = await rewriteCssText(css, normalised, nextAncestry);
          const blob = new Blob([rewritten.css], { type: "text/css;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          cssObjectUrls.set(normalised, url);
          return url;
        })();

        cssObjectUrlPromises.set(normalised, promise);
        try { return await promise; }
        finally { cssObjectUrlPromises.delete(normalised); }
      }

      async function rewriteCssText(css, basePath, ancestry = new Set()) {
        const replacements = [];

        let output = await asyncReplace(
          css,
          /url\(\s*(["']?)(.*?)\1\s*\)/gi,
          async (whole, quote, rawReference) => {
            const reference = rawReference.trim();
            const resolved = resolveProjectPath(reference, basePath);
            const file = resolved && getProjectFile(resolved);
            if (!file) return whole;

            const isCss = /\.css$/i.test(stripQueryAndHash(reference)) || file.type === "text/css";
            const replacement = isCss
              ? await getCssObjectUrl(resolved, ancestry)
              : getAssetObjectUrl(resolved);
            if (!replacement) return whole;

            replacements.push([replacement, reference]);
            return `url("${replacement}")`;
          }
        );

        output = await asyncReplace(
          output,
          /@import\s+(["'])(.*?)\1/gi,
          async (whole, quote, rawReference) => {
            const reference = rawReference.trim();
            const resolved = resolveProjectPath(reference, basePath);
            if (!resolved || !getProjectFile(resolved)) return whole;
            const replacement = await getCssObjectUrl(resolved, ancestry);
            if (!replacement) return whole;
            replacements.push([replacement, reference]);
            return `@import url("${replacement}")`;
          }
        );

        return { css: output, replacements };
      }

      function recordOriginalAttribute(element, attribute, original) {
        element.setAttribute(`data-lw-original-${attribute}`, original);
      }

      async function rewriteAttribute(element, attribute, basePath, useCssLoader = false) {
        const original = element.getAttribute(attribute);
        const resolved = resolveProjectPath(original, basePath);
        if (!resolved || !getProjectFile(resolved)) return;
        const replacement = useCssLoader
          ? await getCssObjectUrl(resolved)
          : getAssetObjectUrl(resolved);
        if (!replacement) return;
        recordOriginalAttribute(element, attribute, original);
        element.setAttribute(attribute, replacement);
      }

      function splitSrcset(srcset) {
        return srcset.split(",").map(candidate => candidate.trim()).filter(Boolean);
      }

      async function rewriteSrcset(element, basePath) {
        const original = element.getAttribute("srcset");
        if (!original) return;
        let changed = false;
        const candidates = splitSrcset(original).map(candidate => {
          const match = candidate.match(/^(\S+)(\s+.*)?$/);
          if (!match) return candidate;
          const reference = match[1];
          const resolved = resolveProjectPath(reference, basePath);
          const replacement = resolved && getAssetObjectUrl(resolved);
          if (!replacement) return candidate;
          changed = true;
          return `${replacement}${match[2] || ""}`;
        });
        if (changed) {
          recordOriginalAttribute(element, "srcset", original);
          element.setAttribute("srcset", candidates.join(", "));
        }
      }

      async function prepareHtmlForVisual(html) {
        storedDoctype = extractDoctype(html);
        const parsed = new DOMParser().parseFromString(html, "text/html");
        const basePath = currentDocumentPath;

        if (parsed.body) {
          if (parsed.body.hasAttribute("contenteditable")) {
            parsed.body.setAttribute(
              "data-lw-original-contenteditable",
              parsed.body.getAttribute("contenteditable")
            );
          } else {
            parsed.body.setAttribute("data-lw-remove-contenteditable", "");
          }
        }

        if (!projectFiles.size) {
          return `${storedDoctype}\n${parsed.documentElement.outerHTML}`;
        }

        const ordinaryAttributes = [
          ["img[src]", "src"],
          ["source[src]", "src"],
          ["video[src]", "src"],
          ["video[poster]", "poster"],
          ["audio[src]", "src"],
          ["track[src]", "src"],
          ["iframe[src]", "src"],
          ["embed[src]", "src"],
          ["object[data]", "data"],
          ["input[type='image'][src]", "src"],
          ["image[href]", "href"],
          ["link[rel~='icon'][href]", "href"]
        ];

        for (const [selector, attribute] of ordinaryAttributes) {
          for (const element of parsed.querySelectorAll(selector)) {
            await rewriteAttribute(element, attribute, basePath);
          }
        }

        for (const element of parsed.querySelectorAll("img[srcset], source[srcset]")) {
          await rewriteSrcset(element, basePath);
        }

        for (const link of parsed.querySelectorAll("link[rel~='stylesheet'][href]")) {
          await rewriteAttribute(link, "href", basePath, true);
        }

        for (const element of parsed.querySelectorAll("[style]")) {
          const original = element.getAttribute("style");
          const rewritten = await rewriteCssText(original, basePath);
          if (rewritten.replacements.length) {
            element.setAttribute("style", rewritten.css);
            element.setAttribute("data-lw-css-map", JSON.stringify(rewritten.replacements));
          }
        }

        for (const styleElement of parsed.querySelectorAll("style")) {
          const rewritten = await rewriteCssText(styleElement.textContent || "", basePath);
          if (rewritten.replacements.length) {
            styleElement.textContent = rewritten.css;
            styleElement.setAttribute("data-lw-css-map", JSON.stringify(rewritten.replacements));
          }
        }

        return `${storedDoctype}\n${parsed.documentElement.outerHTML}`;
      }

      function restoreCssMappings(element, getText, setText) {
        const encoded = element.getAttribute("data-lw-css-map");
        if (!encoded) return;
        try {
          let value = getText();
          const replacements = JSON.parse(encoded);
          for (const [replacement, original] of replacements) {
            value = value.split(replacement).join(original);
          }
          setText(value);
        } catch {
          // Leave the current CSS untouched if the internal map was damaged.
        }
        element.removeAttribute("data-lw-css-map");
      }

      const machineOwnedSelectors = [
        "#toc-list",
        "#mobile-toc-list",
        "#figure-index",
        "#table-index"
      ];

      function elementForNode(node) {
        if (!node) return null;
        return node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      }

      function lockMachineOwnedSections(doc) {
        let locked = 0;
        for (const element of doc.querySelectorAll(machineOwnedSelectors.join(","))) {
          if (element.hasAttribute("data-lw-editor-lock")) continue;
          element.setAttribute(
            "data-lw-editor-lock",
            element.hasAttribute("contenteditable")
              ? element.getAttribute("contenteditable")
              : "__missing__"
          );
          element.setAttribute("contenteditable", "false");
          locked += 1;
        }
        return locked;
      }

      function restoreMachineOwnedSections(root) {
        for (const element of root.querySelectorAll("[data-lw-editor-lock]")) {
          const original = element.getAttribute("data-lw-editor-lock");
          if (original === "__missing__") element.removeAttribute("contenteditable");
          else element.setAttribute("contenteditable", original);
          element.removeAttribute("data-lw-editor-lock");
        }
      }

      function cleanedVisualDocumentHtml() {
        const doc = editorDocument();
        if (!doc?.documentElement) return sourceEditor.value || starterDocument;
        const clone = doc.documentElement.cloneNode(true);

        const attributes = ["src", "srcset", "href", "poster", "data"];
        for (const attribute of attributes) {
          const marker = `data-lw-original-${attribute}`;
          for (const element of clone.querySelectorAll(`[${marker}]`)) {
            element.setAttribute(attribute, element.getAttribute(marker));
            element.removeAttribute(marker);
          }
        }

        for (const element of clone.querySelectorAll("[data-lw-css-map]")) {
          if (element.tagName.toLowerCase() === "style") {
            restoreCssMappings(
              element,
              () => element.textContent || "",
              value => { element.textContent = value; }
            );
          } else {
            restoreCssMappings(
              element,
              () => element.getAttribute("style") || "",
              value => { element.setAttribute("style", value); }
            );
          }
        }

        const body = clone.querySelector("body");
        if (body?.hasAttribute("data-lw-original-contenteditable")) {
          body.setAttribute("contenteditable", body.getAttribute("data-lw-original-contenteditable"));
          body.removeAttribute("data-lw-original-contenteditable");
        } else if (body?.hasAttribute("data-lw-remove-contenteditable")) {
          body.removeAttribute("contenteditable");
          body.removeAttribute("data-lw-remove-contenteditable");
        }

        restoreMachineOwnedSections(clone);

        for (const element of clone.querySelectorAll("*")) {
          for (const attribute of [...element.attributes]) {
            if (attribute.name.startsWith("data-lw-")) element.removeAttribute(attribute.name);
          }
        }

        return `${storedDoctype}\n${clone.outerHTML}`;
      }

      function enableEditing(loadSequence) {
        if (loadSequence !== visualLoadSequence) return;
        try {
          const doc = editorDocument();
          if (!doc) return;
          doc.designMode = "on";
          doc.body?.setAttribute("contenteditable", "true");
          const lockedCount = lockMachineOwnedSections(doc);

          doc.addEventListener("beforeinput", event => {
            if (elementForNode(event.target)?.closest?.("[data-lw-editor-lock]")) {
              event.preventDefault();
              setStatus("That section is generated automatically. Edit the relevant heading, figure or table instead.", true);
            }
          });

          doc.addEventListener("input", () => {
            markDirty();
            updateCount();
          });

          doc.addEventListener("selectionchange", () => {
            const selection = doc.getSelection();
            if (selection?.rangeCount) {
              const range = selection.getRangeAt(0);
              if (doc.body?.contains(range.commonAncestorContainer)) {
                savedVisualRange = range.cloneRange();
              }
            }
            updateCount();
          });
          doc.addEventListener("keydown", event => {
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
              event.preventDefault();
              saveFile();
            }
          });

          updateCount();
          const assetNote = projectFiles.size
            ? ` Local assets loaded from ${projectRootName || "the selected folder"}.`
            : "";
          const lockNote = lockedCount
            ? ` ${lockedCount} generated contents/index section${lockedCount === 1 ? " is" : "s are"} protected.`
            : "";
          const saveNote = currentFileHandle?.createWritable
            ? " Direct save is available."
            : " Saving will download a replacement file.";
          setStatus(`Visual editor ready.${assetNote}${lockNote}${saveNote} Scripts are preserved but not executed.`);
        } catch (error) {
          setStatus(`Could not initialise visual editing: ${error.message}`, true);
        }
      }

      async function loadVisual(html) {
        savedVisualRange = null;
        const sequence = ++visualLoadSequence;
        setStatus(projectFiles.size ? "Resolving local images and stylesheets" : "Loading visual editor");
        try {
          const preparedHtml = await prepareHtmlForVisual(html);
          if (sequence !== visualLoadSequence) return;
          visualEditor.onload = () => enableEditing(sequence);
          visualEditor.srcdoc = preparedHtml;
        } catch (error) {
          setStatus(`Could not prepare the page: ${error.message}`, true);
        }
      }

      function visualHTML() {
        return cleanedVisualDocumentHtml();
      }

      async function switchMode(mode) {
        if (mode === currentMode) return;

        if (mode === "source") {
          sourceEditor.value = visualHTML();
          visualEditor.classList.add("hidden");
          sourceEditor.classList.remove("hidden");
          toolbar.querySelectorAll("button, select").forEach(el => el.disabled = true);
          sourceModeBtn.classList.add("active");
          visualModeBtn.classList.remove("active");
          currentMode = "source";
          sourceEditor.focus();
          updateCount();
          setStatus("Editing HTML source");
        } else {
          const html = sourceEditor.value.trim() || starterDocument;
          storedDoctype = extractDoctype(html);
          sourceEditor.classList.add("hidden");
          visualEditor.classList.remove("hidden");
          toolbar.querySelectorAll("button, select").forEach(el => el.disabled = false);
          sourceModeBtn.classList.remove("active");
          visualModeBtn.classList.add("active");
          currentMode = "visual";
          await loadVisual(html);
        }
      }

      function exec(command, value = null) {
        if (currentMode !== "visual") return;
        const doc = editorDocument();
        try {
          visualEditor.contentWindow.focus();
          doc.execCommand(command, false, value);
          markDirty();
          updateCount();
        } catch (error) {
          setStatus(`Formatting command failed: ${error.message}`, true);
        }
      }

      function updateCount() {
        let text = "";
        if (currentMode === "visual") {
          text = editorDocument()?.body?.innerText || "";
        } else {
          const temp = document.createElement("div");
          temp.innerHTML = sourceEditor.value;
          text = temp.textContent || "";
        }

        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const chars = text.length;
        count.textContent = `${words.toLocaleString()} words · ${chars.toLocaleString()} characters`;
      }

      function insertHTML(html) {
        const doc = editorDocument();
        visualEditor.contentWindow.focus();

        if (doc.queryCommandSupported?.("insertHTML")) {
          doc.execCommand("insertHTML", false, html);
        } else {
          const selection = doc.getSelection();
          if (!selection?.rangeCount) return;
          const range = selection.getRangeAt(0);
          range.deleteContents();
          const fragment = range.createContextualFragment(html);
          range.insertNode(fragment);
        }

        markDirty();
        updateCount();
      }


      function getSavedVisualRange(doc) {
        const selection = doc.getSelection();
        if (selection?.rangeCount) {
          const current = selection.getRangeAt(0);
          if (doc.body?.contains(current.commonAncestorContainer)) {
            return current.cloneRange();
          }
        }

        if (
          savedVisualRange &&
          savedVisualRange.startContainer?.ownerDocument === doc &&
          doc.body?.contains(savedVisualRange.commonAncestorContainer)
        ) {
          return savedVisualRange.cloneRange();
        }

        return null;
      }

      function restoreVisualRange(doc, range, collapseToEnd = false) {
        const selection = doc.getSelection();
        if (!selection || !range) return null;
        const restored = range.cloneRange();
        if (collapseToEnd) restored.collapse(false);
        selection.removeAllRanges();
        selection.addRange(restored);
        savedVisualRange = restored.cloneRange();
        visualEditor.contentWindow.focus();
        return restored;
      }

      function normaliseLinkTarget(value) {
        let target = String(value || "").trim();
        if (/^www\./i.test(target)) target = `https://${target}`;
        if (/^(?:javascript|vbscript|data):/i.test(target)) return "";
        return target;
      }

      function insertLink() {
        if (currentMode !== "visual") return;
        const doc = editorDocument();
        const originalRange = getSavedVisualRange(doc);
        if (!originalRange) {
          setStatus("Select text, or place the cursor where the link should be inserted.", true);
          return;
        }

        const entered = prompt(
          "Enter a full external URL (https://…) or an internal target (#section-id):",
          "https://"
        );
        if (entered === null) return;
        const target = normaliseLinkTarget(entered);
        if (!target || target === "https://" || target === "http://") {
          setStatus("Enter a valid link. Script and data URLs are not allowed.", true);
          return;
        }

        if (target.startsWith("#")) {
          const id = safeDecode(target.slice(1));
          if (!id || !doc.getElementById(id)) {
            setStatus(`Internal target ${target} does not exist. Add its id in Source mode first.`, true);
            return;
          }
        }

        const range = restoreVisualRange(doc, originalRange);
        if (!range) {
          setStatus("The link insertion point was lost. Select the text and try again.", true);
          return;
        }

        if (range.collapsed) {
          const label = prompt("Visible link text:", target.startsWith("#") ? target.slice(1) : target);
          if (label === null || !label.trim()) return;
          const link = doc.createElement("a");
          link.href = target;
          link.textContent = label.trim();
          range.insertNode(link);
          range.setStartAfter(link);
          range.collapse(true);
          restoreVisualRange(doc, range);
        } else {
          doc.execCommand("createLink", false, target);
        }

        markDirty();
        updateCount();
        setStatus(`Inserted link to ${target}.`);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function slugifyFootnote(value) {
        return String(value || "")
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/&/g, " and ")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 48) || "note";
      }

      function uniqueFootnoteSlug(doc, base) {
        let slug = base;
        let suffix = 2;
        while (doc.getElementById(`fn:${slug}`) || doc.getElementById(`fnref:${slug}`)) {
          slug = `${base}-${suffix}`;
          suffix += 1;
        }
        return slug;
      }

      function nextFootnoteNumber(doc, list) {
        const referenceNumbers = [...doc.querySelectorAll("a.footnote-ref, .footnote-ref a")]
          .map(link => Number.parseInt(link.textContent, 10))
          .filter(Number.isFinite);
        const listCount = [...list.children].filter(child => child.tagName === "LI").length;
        return Math.max(listCount, 0, ...referenceNumbers) + 1;
      }

      function renumberFootnotesInDocument(doc) {
        const references = [...doc.querySelectorAll("a.footnote-ref")]
          .map(link => {
            const href = link.getAttribute("href") || "";
            const key = href.startsWith("#fn:") ? href.slice(4) : "";
            return { link, key, sup: link.closest("sup") };
          })
          .filter(item => item.key && item.sup);

        const keys = references.map(item => item.key);
        if (new Set(keys).size !== keys.length) return new Map();

        const section = doc.querySelector("section.footnotes");
        const list = section?.querySelector("ol");
        if (!list) return new Map();

        const notes = new Map(
          [...list.children]
            .filter(item => item.tagName === "LI" && item.id.startsWith("fn:"))
            .map(item => [item.id.slice(3), item])
        );
        if (keys.some(key => !notes.has(key))) return new Map();

        const ranks = new Map();
        references.forEach(({ link, key, sup }, index) => {
          const number = index + 1;
          ranks.set(key, number);
          link.textContent = String(number);
          link.setAttribute("href", `#fn:${key}`);
          sup.id = `fnref:${key}`;

          const note = notes.get(key);
          const backref = note.querySelector("a.footnote-backref, a.footnote");
          if (backref) {
            backref.setAttribute("href", `#fnref:${key}`);
            backref.title = `Jump back to footnote ${number} in the text`;
          }
          list.appendChild(note);
        });

        return ranks;
      }

      function ensureFootnoteStyles(doc) {
        if (doc.getElementById("lw-footnote-editor-styles")) return;
        const existingCss = [...doc.querySelectorAll("style")]
          .map(style => style.textContent || "")
          .join("\n");
        if (/a\.footnote-ref\b/.test(existingCss) && /\.footnotes\b/.test(existingCss)) return;
        const style = doc.createElement("style");
        style.id = "lw-footnote-editor-styles";
        style.textContent = `
          a.footnote-ref, .footnote-ref a {
            text-decoration: none;
            font: 700 .72rem/1 var(--sans, system-ui, sans-serif);
            background: var(--gold-soft, #eee3c8);
            border-radius: 999px;
            min-width: 1.35rem;
            height: 1.35rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: .12rem;
          }
          .footnotes {
            margin-top: 4rem;
            padding-top: 1rem;
            border-top: 1px solid var(--line, #d5d0c5);
            color: #45504e;
            font-size: .9rem;
          }
          .footnotes ol { padding-left: 1.4rem; }
          .footnotes li { margin: 1rem 0; }
          .footnotes a.footnote-backref,
          .footnotes .footnote {
            margin-left: .3rem;
            text-decoration: none;
          }
        `;
        (doc.head || doc.documentElement).appendChild(style);
      }

      function sanitiseFootnoteFragment(doc, rawValue) {
        const trimmed = String(rawValue || "").trim();
        const wrapper = doc.createElement("div");
        const containsHtml = /<\/?[a-z][^>]*>/i.test(trimmed);

        if (containsHtml) {
          wrapper.innerHTML = trimmed;
          wrapper.querySelectorAll("script, iframe, object, embed, style, link, meta, base").forEach(node => node.remove());
          wrapper.querySelectorAll("*").forEach(element => {
            for (const attribute of [...element.attributes]) {
              if (/^on/i.test(attribute.name)) element.removeAttribute(attribute.name);
              if (
                /^(href|src|xlink:href)$/i.test(attribute.name) &&
                /^\s*javascript:/i.test(attribute.value)
              ) {
                element.removeAttribute(attribute.name);
              }
            }
          });
        } else {
          const paragraphs = trimmed.split(/\n\s*\n/);
          for (const paragraphText of paragraphs) {
            const paragraph = doc.createElement("p");
            paragraph.innerHTML = escapeHtml(paragraphText).replace(/\n/g, "<br>");
            wrapper.appendChild(paragraph);
          }
        }

        const hasBlock = [...wrapper.children].some(element =>
          /^(P|DIV|BLOCKQUOTE|PRE|UL|OL|TABLE|FIGURE)$/i.test(element.tagName)
        );
        if (!hasBlock) {
          const paragraph = doc.createElement("p");
          while (wrapper.firstChild) paragraph.appendChild(wrapper.firstChild);
          wrapper.appendChild(paragraph);
        }

        return wrapper;
      }

      function footnoteSectionForRange(doc, range) {
        let section = doc.querySelector("section.footnotes");
        if (section) {
          let list = section.querySelector("ol");
          if (!list) {
            list = doc.createElement("ol");
            section.appendChild(list);
          }
          return { section, list };
        }

        section = doc.createElement("section");
        section.className = "footnotes";
        section.appendChild(doc.createElement("hr"));
        const list = doc.createElement("ol");
        section.appendChild(list);

        const anchorElement = range.commonAncestorContainer.nodeType === Node.ELEMENT_NODE
          ? range.commonAncestorContainer
          : range.commonAncestorContainer.parentElement;
        const container = anchorElement?.closest("article") ||
          doc.querySelector("article#article") ||
          doc.querySelector("article") ||
          doc.querySelector("main") ||
          doc.body;
        container.appendChild(section);
        return { section, list };
      }

      function insertFootnote() {
        if (currentMode !== "visual") return;
        const doc = editorDocument();
        const originalRange = getSavedVisualRange(doc);

        if (!originalRange) {
          setStatus("Place the cursor after the sentence or phrase that needs a footnote.", true);
          return;
        }

        const anchorElement = originalRange.commonAncestorContainer.nodeType === Node.ELEMENT_NODE
          ? originalRange.commonAncestorContainer
          : originalRange.commonAncestorContainer.parentElement;
        if (anchorElement?.closest("section.footnotes")) {
          setStatus("Place the cursor in the main text, not inside the footnotes section.", true);
          return;
        }

        const rawText = prompt(
          "Enter the footnote text. Basic HTML such as <strong>, <em> and <a href=\"…\"> is allowed:",
          ""
        );
        if (rawText === null || !rawText.trim()) return;

        ensureFootnoteStyles(doc);
        const { list } = footnoteSectionForRange(doc, originalRange);
        const number = nextFootnoteNumber(doc, list);
        const content = sanitiseFootnoteFragment(doc, rawText);
        const plainText = content.textContent.trim();
        const slug = uniqueFootnoteSlug(doc, slugifyFootnote(plainText || `note-${number}`));

        const item = doc.createElement("li");
        item.id = `fn:${slug}`;
        while (content.firstChild) item.appendChild(content.firstChild);

        let finalParagraph = [...item.querySelectorAll("p")].pop();
        if (!finalParagraph) {
          finalParagraph = doc.createElement("p");
          while (item.firstChild) finalParagraph.appendChild(item.firstChild);
          item.appendChild(finalParagraph);
        }

        finalParagraph.appendChild(doc.createTextNode("\u00a0"));
        const backref = doc.createElement("a");
        backref.className = "footnote-backref";
        backref.href = `#fnref:${slug}`;
        backref.title = `Jump back to footnote ${number} in the text`;
        backref.textContent = "↩";
        finalParagraph.appendChild(backref);
        list.appendChild(item);

        const range = restoreVisualRange(doc, originalRange, true);
        if (!range) {
          item.remove();
          setStatus("The insertion point was lost. Place the cursor and try again.", true);
          return;
        }

        const sup = doc.createElement("sup");
        sup.id = `fnref:${slug}`;
        const reference = doc.createElement("a");
        reference.className = "footnote-ref";
        reference.href = `#fn:${slug}`;
        reference.textContent = String(number);
        sup.appendChild(reference);
        range.insertNode(sup);
        range.setStartAfter(sup);
        range.collapse(true);
        restoreVisualRange(doc, range);

        const ranks = renumberFootnotesInDocument(doc);
        const finalNumber = ranks.get(slug) || number;

        markDirty();
        updateCount();
        setStatus(`Inserted footnote ${finalNumber}; all footnotes are now in document order.`);
      }

      function currentHtml({ renumberVisualFootnotes = false } = {}) {
        if (currentMode === "source") return sourceEditor.value;
        if (renumberVisualFootnotes) renumberFootnotesInDocument(editorDocument());
        return visualHTML();
      }

      function checkDocumentIntegrity(html = currentHtml()) {
        const doc = new DOMParser().parseFromString(html, "text/html");
        const errors = [];
        const warnings = [];

        const ids = new Map();
        for (const element of doc.querySelectorAll("[id]")) {
          const id = element.id;
          if (!id) {
            warnings.push(`Empty id on <${element.tagName.toLowerCase()}>.`);
            continue;
          }
          ids.set(id, (ids.get(id) || 0) + 1);
        }
        const duplicateIds = [...ids].filter(([, count]) => count > 1).map(([id]) => id);
        if (duplicateIds.length) errors.push(`Duplicate id(s): ${duplicateIds.join(", ")}`);

        const brokenInternal = new Set();
        for (const link of doc.querySelectorAll("a[href^='#']")) {
          const raw = link.getAttribute("href").slice(1);
          if (!raw) continue;
          const id = safeDecode(raw);
          if (!ids.has(id)) brokenInternal.add(`#${id}`);
        }
        if (brokenInternal.size) {
          errors.push(`Broken internal link(s): ${[...brokenInternal].join(", ")}`);
        }

        const unsafeLinks = [...doc.querySelectorAll("a[href]")]
          .map(link => link.getAttribute("href") || "")
          .filter(href => /^(?:javascript|vbscript|data):/i.test(href));
        if (unsafeLinks.length) errors.push(`Unsafe link URL(s): ${unsafeLinks.join(", ")}`);

        const refs = [...doc.querySelectorAll("a.footnote-ref")];
        const notes = new Map(
          [...doc.querySelectorAll("section.footnotes li[id^='fn:']")]
            .map(note => [note.id.slice(3), note])
        );
        const referencedKeys = [];
        refs.forEach((link, index) => {
          const href = link.getAttribute("href") || "";
          const key = href.startsWith("#fn:") ? href.slice(4) : "";
          const sup = link.closest("sup");
          if (!key || !sup || sup.id !== `fnref:${key}`) {
            errors.push(`Malformed footnote reference near number ${link.textContent.trim() || index + 1}.`);
            return;
          }
          referencedKeys.push(key);
          if (!notes.has(key)) errors.push(`Footnote reference ${key} has no matching note.`);
          if (link.textContent.trim() !== String(index + 1)) {
            errors.push(`Footnote ${key} is numbered ${link.textContent.trim() || "?"}, expected ${index + 1}.`);
          }
          const backref = notes.get(key)?.querySelector("a.footnote-backref, a.footnote");
          if (!backref || backref.getAttribute("href") !== `#fnref:${key}`) {
            errors.push(`Footnote ${key} has no valid back-reference.`);
          }
        });
        if (new Set(referencedKeys).size !== referencedKeys.length) {
          errors.push("A footnote is referenced more than once.");
        }
        const orphans = [...notes.keys()].filter(key => !referencedKeys.includes(key));
        if (orphans.length) errors.push(`Footnote(s) without a reference: ${orphans.join(", ")}`);

        const missingHeadingIds = [...doc.querySelectorAll("article h2:not([id]), article h3:not([id])")]
          .filter(heading => !heading.closest("figure, aside, details"));
        if (missingHeadingIds.length) {
          warnings.push(`${missingHeadingIds.length} article heading(s) have no id and cannot be linked internally.`);
        }

        const missingLocal = new Set();
        if (projectFiles.size) {
          for (const element of doc.querySelectorAll("[href], [src], [poster], [data]")) {
            for (const attribute of ["href", "src", "poster", "data"]) {
              if (!element.hasAttribute(attribute)) continue;
              const reference = element.getAttribute(attribute);
              const resolved = resolveProjectPath(reference);
              if (resolved && !getProjectFile(resolved)) missingLocal.add(reference);
            }
          }
        }
        if (missingLocal.size) warnings.push(`Missing local file(s): ${[...missingLocal].join(", ")}`);

        return {
          errors,
          warnings,
          counts: {
            ids: ids.size,
            internalLinks: doc.querySelectorAll("a[href^='#']").length,
            footnotes: refs.length
          }
        };
      }

      function integritySummary(report) {
        if (report.errors.length) {
          return `${report.errors.length} error${report.errors.length === 1 ? "" : "s"}` +
            (report.warnings.length ? ` and ${report.warnings.length} warning${report.warnings.length === 1 ? "" : "s"}` : "");
        }
        if (report.warnings.length) {
          return `${report.warnings.length} warning${report.warnings.length === 1 ? "" : "s"}`;
        }
        return `passed: ${report.counts.ids} ids, ${report.counts.internalLinks} internal links, ${report.counts.footnotes} footnotes`;
      }

      function showIntegrityCheck() {
        const report = checkDocumentIntegrity();
        const summary = integritySummary(report);
        setStatus(`Check ${summary}.`, Boolean(report.errors.length));
        if (report.errors.length || report.warnings.length) {
          const lines = [
            ...report.errors.map(item => `ERROR: ${item}`),
            ...report.warnings.map(item => `WARNING: ${item}`)
          ];
          alert(`Document check\n\n${lines.join("\n")}`);
        }
        return report;
      }

      function downloadHtml(html) {
        const blob = new Blob([html], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = currentFilename || "document.html";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        markDirty(false);
        setStatus(`Downloaded ${currentFilename}. Replace the repository copy with this file if your browser renamed or relocated it.`);
      }

      async function ensureWritePermission(handle) {
        if (!handle?.queryPermission || !handle?.requestPermission) return true;
        const options = { mode: "readwrite" };
        if (await handle.queryPermission(options) === "granted") return true;
        return await handle.requestPermission(options) === "granted";
      }

      async function writeHtmlToHandle(handle, html) {
        if (!await ensureWritePermission(handle)) throw new Error("Write permission was not granted");
        const writable = await handle.createWritable();
        try {
          await writable.write(new Blob([html], { type: "text/html;charset=utf-8" }));
          await writable.close();
        } catch (error) {
          try { await writable.abort(); } catch { /* The stream may already be closed. */ }
          throw error;
        }
      }

      async function saveFile() {
        if (saveInProgress) return;
        const html = currentHtml({ renumberVisualFootnotes: true });
        const report = checkDocumentIntegrity(html);
        if (report.errors.length) {
          const proceed = confirm(
            `The document check found ${integritySummary(report)}. ` +
            "Saving may leave broken links or footnotes. Save anyway?"
          );
          if (!proceed) {
            setStatus("Save cancelled. Use Check for details.", true);
            return;
          }
        }

        if (!currentFileHandle?.createWritable) {
          downloadHtml(html);
          return;
        }

        saveInProgress = true;
        saveBtn.disabled = true;
        setStatus(`Saving directly to ${currentFilename}…`);
        try {
          await writeHtmlToHandle(currentFileHandle, html);
          if (currentDocumentPath && projectFiles.has(currentDocumentPath)) {
            registerProjectFile(currentDocumentPath, await currentFileHandle.getFile(), currentFileHandle);
          }
          markDirty(false);
          setStatus(`Saved directly to ${currentFilename}. Git can now review the change.`);
        } catch (error) {
          setStatus(`Could not save directly: ${error.message}`, true);
          if (confirm("Direct save failed. Download the edited HTML instead?")) downloadHtml(html);
        } finally {
          saveInProgress = false;
          saveBtn.disabled = false;
        }
      }

      async function showOpenedHtml(html, fileName, documentPath = "") {
        currentFilename = fileName.replace(/\.(html?)$/i, "") + ".html";
        updateSaveButton();
        currentDocumentPath = normalisePath(documentPath);
        storedDoctype = extractDoctype(html);
        sourceEditor.value = html;

        if (currentMode === "source") {
          sourceEditor.classList.add("hidden");
          visualEditor.classList.remove("hidden");
          toolbar.querySelectorAll("button, select").forEach(el => el.disabled = false);
          sourceModeBtn.classList.remove("active");
          visualModeBtn.classList.add("active");
          currentMode = "visual";
        }

        await loadVisual(html);
        markDirty(false);
      }

      async function openFile(file, handle = null) {
        if (!file) return;
        try {
          clearProject();
          setCurrentFileHandle(handle);
          const html = await file.text();
          await showOpenedHtml(html, file.name, file.name);
          setStatus(
            handle
              ? `Opened ${file.name} with direct-save access. Use Open Folder if local images need to be displayed.`
              : `Opened ${file.name} read-only. Saving will download a replacement file.`
          );
        } catch (error) {
          setCurrentFileHandle(null);
          setStatus(`Could not open file: ${error.message}`, true);
        } finally {
          fileInput.value = "";
        }
      }

      async function openHtmlFile() {
        if (!confirmDiscardUnsaved("open another HTML file")) return;
        if (!window.showOpenFilePicker) {
          fileInput.click();
          return;
        }

        try {
          const [handle] = await window.showOpenFilePicker({
            id: "lightweight-html-editor-document",
            multiple: false,
            types: [{
              description: "HTML documents",
              accept: { "text/html": [".html", ".htm"] }
            }]
          });
          await openFile(await handle.getFile(), handle);
        } catch (error) {
          if (error?.name === "AbortError") {
            setStatus("Opening cancelled");
            return;
          }
          setStatus("Direct file access is unavailable; using the read-only file picker.");
          fileInput.click();
        }
      }

      async function indexDirectoryHandle(directoryHandle, prefix = "") {
        for await (const [name, handle] of directoryHandle.entries()) {
          const path = normalisePath(`${prefix}/${name}`);
          if (handle.kind === "directory") {
            if ([".git", "node_modules", ".venv", "__pycache__"].includes(name)) continue;
            await indexDirectoryHandle(handle, path);
          } else {
            const file = await handle.getFile();
            registerProjectFile(path, file, handle);
          }
        }
      }

      async function openWritableFolder() {
        if (!confirmDiscardUnsaved("open another folder")) return;
        if (!window.showDirectoryPicker) {
          folderInput.click();
          return;
        }

        try {
          const directoryHandle = await window.showDirectoryPicker({
            id: "lightweight-html-editor-project",
            mode: "readwrite"
          });
          clearProject();
          projectDirectoryHandle = directoryHandle;
          projectRootName = directoryHandle.name || "selected folder";
          setStatus("Indexing project folder");
          await indexDirectoryHandle(directoryHandle);

          const htmlEntries = [...projectFiles.entries()]
            .filter(([path]) => /\.html?$/i.test(path))
            .map(([path, file]) => ({ file, path }))
            .sort((a, b) => a.path.localeCompare(b.path));

          if (!htmlEntries.length) {
            clearProject();
            setStatus("The selected folder contains no HTML files", true);
            return;
          }

          const selected = chooseHtmlFile(htmlEntries);
          if (!selected) {
            clearProject();
            setStatus("Folder opening cancelled");
            return;
          }

          const html = await selected.file.text();
          setCurrentFileHandle(projectFileHandles.get(selected.path) || null);
          await showOpenedHtml(html, basename(selected.path), selected.path);
          setStatus(
            `Opened ${selected.path} with writable access to ${projectRootName}. ` +
            "Save writes back to this HTML file, and inserted images can be copied into the project automatically."
          );
        } catch (error) {
          if (error?.name === "AbortError") {
            setStatus("Folder opening cancelled");
            return;
          }
          setStatus("Writable folder access is unavailable; using the read-only folder picker.");
          folderInput.click();
        }
      }

      function folderRelativePath(file) {
        const raw = file.webkitRelativePath || file.name;
        const parts = raw.replace(/\\/g, "/").split("/").filter(Boolean);
        if (parts.length > 1) parts.shift();
        return normalisePath(parts.join("/"));
      }

      function chooseHtmlFile(htmlEntries) {
        if (htmlEntries.length === 1) return htmlEntries[0];

        const preferredNames = [currentFilename, "search-textbook.html", "index.html"];
        let preferredIndex = -1;
        for (const name of preferredNames) {
          preferredIndex = htmlEntries.findIndex(entry => basename(entry.path).toLowerCase() === name.toLowerCase());
          if (preferredIndex !== -1) break;
        }
        preferredIndex = Math.max(0, preferredIndex);
        const visible = htmlEntries.slice(0, 50);
        const choices = visible.map((entry, index) => `${index + 1}. ${entry.path}`).join("\n");
        const extra = htmlEntries.length > visible.length
          ? `\n\nOnly the first ${visible.length} of ${htmlEntries.length} files are listed.`
          : "";
        const answer = prompt(
          `Choose the HTML file to edit by number:\n\n${choices}${extra}`,
          String(Math.min(preferredIndex, visible.length - 1) + 1)
        );
        if (answer === null) return null;
        const selectedIndex = Number.parseInt(answer, 10) - 1;
        return visible[selectedIndex] || visible[preferredIndex] || visible[0];
      }

      async function openFolder(files) {
        const selectedFiles = [...files];
        folderInput.value = "";
        if (!selectedFiles.length) return;

        try {
          clearProject();
          const firstPath = selectedFiles[0].webkitRelativePath || "";
          projectRootName = firstPath.split(/[\\/]/)[0] || "selected folder";

          for (const file of selectedFiles) {
            const path = folderRelativePath(file);
            registerProjectFile(path, file);
          }

          const htmlEntries = selectedFiles
            .map(file => ({ file, path: folderRelativePath(file) }))
            .filter(entry => /\.html?$/i.test(entry.path))
            .sort((a, b) => a.path.localeCompare(b.path));

          if (!htmlEntries.length) {
            clearProject();
            setStatus("The selected folder contains no HTML files", true);
            return;
          }

          const selected = chooseHtmlFile(htmlEntries);
          if (!selected) {
            clearProject();
            setStatus("Folder opening cancelled");
            return;
          }

          const html = await selected.file.text();
          await showOpenedHtml(html, basename(selected.path), selected.path);
          setStatus(`Opened ${selected.path} with access to ${selectedFiles.length - 1} neighbouring files.`);
        } catch (error) {
          clearProject();
          setStatus(`Could not open folder: ${error.message}`, true);
        }
      }

      async function newDocument() {
        if (!confirmDiscardUnsaved("create a new document")) return;
        clearProject();
        currentFilename = "untitled.html";
        updateSaveButton();
        currentDocumentPath = "untitled.html";
        storedDoctype = "<!doctype html>";
        sourceEditor.value = starterDocument;
        if (currentMode === "source") {
          sourceEditor.classList.add("hidden");
          visualEditor.classList.remove("hidden");
          toolbar.querySelectorAll("button, select").forEach(el => el.disabled = false);
          sourceModeBtn.classList.remove("active");
          visualModeBtn.classList.add("active");
          currentMode = "visual";
        }
        await loadVisual(starterDocument);
        markDirty(false);
        setStatus("New document");
      }

      visualModeBtn.addEventListener("click", () => switchMode("visual"));
      sourceModeBtn.addEventListener("click", () => switchMode("source"));

      document.getElementById("newBtn").addEventListener("click", newDocument);
      document.getElementById("openBtn").addEventListener("click", openHtmlFile);
      document.getElementById("openFolderBtn").addEventListener("click", openWritableFolder);
      document.getElementById("checkBtn").addEventListener("click", showIntegrityCheck);
      saveBtn.addEventListener("click", saveFile);
      fileInput.addEventListener("change", () => openFile(fileInput.files[0]));
      folderInput.addEventListener("change", () => openFolder(folderInput.files));

      toolbar.addEventListener("click", event => {
        const button = event.target.closest("button[data-command]");
        if (button) exec(button.dataset.command);
      });

      document.getElementById("blockFormat").addEventListener("change", event => {
        if (event.target.value) exec("formatBlock", event.target.value);
        event.target.value = "";
      });

      document.getElementById("linkBtn").addEventListener("click", insertLink);

      document.getElementById("unlinkBtn").addEventListener("click", () => exec("unlink"));
      document.getElementById("footnoteBtn").addEventListener("click", insertFootnote);
      document.getElementById("hrBtn").addEventListener("click", () => insertHTML("<hr>"));
      document.getElementById("imageBtn").addEventListener("click", () => imageInput.click());

      function findMatchingProjectPath(file) {
        const matches = [...projectFiles.entries()].filter(([, candidate]) =>
          candidate.name === file.name &&
          candidate.size === file.size &&
          candidate.lastModified === file.lastModified
        );
        return matches.length === 1 ? matches[0][0] : "";
      }

      async function writeImageToProject(file, destinationPath) {
        if (!projectDirectoryHandle) return null;

        const parts = destinationPath.split("/").filter(Boolean);
        const filename = parts.pop();
        let directory = projectDirectoryHandle;

        for (const part of parts) {
          directory = await directory.getDirectoryHandle(part, { create: true });
        }

        let exists = false;
        try {
          await directory.getFileHandle(filename);
          exists = true;
        } catch (error) {
          if (error?.name !== "NotFoundError") throw error;
        }

        if (exists && !confirm(`${destinationPath} already exists. Replace it?`)) {
          return null;
        }

        const handle = await directory.getFileHandle(filename, { create: true });
        const writable = await handle.createWritable();
        await writable.write(file);
        await writable.close();

        const storedFile = await handle.getFile();
        registerProjectFile(destinationPath, storedFile, handle);
        return storedFile;
      }

      async function insertSelectedImage(file) {
        const existingPath = findMatchingProjectPath(file);
        let destinationPath = existingPath;

        if (!destinationPath) {
          const suggested = `images/${safeFilename(file.name)}`;
          const answer = prompt(
            "Relative path to store in the HTML. The path is relative to the project root:",
            suggested
          );
          if (answer === null) return;

          destinationPath = validateProjectPath(answer);
          if (!destinationPath) {
            setStatus("Use a relative path such as images/figure.png. Absolute paths and .. are not allowed.", true);
            return;
          }

          if (projectDirectoryHandle) {
            setStatus(`Copying image to ${destinationPath}`);
            const copied = await writeImageToProject(file, destinationPath);
            if (!copied) {
              setStatus("Image insertion cancelled");
              return;
            }
          } else {
            registerProjectFile(destinationPath, file);
          }
        }

        const relativeReference = relativePath(dirname(currentDocumentPath), destinationPath);
        const previewUrl = getAssetObjectUrl(destinationPath);
        const alt = prompt(
          "Alternative text for the image:",
          file.name.replace(/\.[^.]+$/, "")
        ) ?? "";

        insertHTML(
          `<img src="${escapeAttribute(previewUrl)}" ` +
          `data-lw-original-src="${escapeAttribute(relativeReference)}" ` +
          `alt="${escapeAttribute(alt)}">`
        );

        if (projectDirectoryHandle || existingPath) {
          setStatus(`Inserted image using relative link: ${relativeReference}`);
        } else {
          setStatus(
            `Inserted relative link ${relativeReference}. ` +
            `Copy the image into ${destinationPath} inside the project folder before publishing.`,
            true
          );
        }
      }

      imageInput.addEventListener("change", async () => {
        const file = imageInput.files[0];
        imageInput.value = "";
        if (!file) return;

        try {
          await insertSelectedImage(file);
        } catch (error) {
          setStatus(`Could not insert image: ${error.message}`, true);
        }
      });

      sourceEditor.addEventListener("input", () => {
        markDirty();
        updateCount();
      });

      sourceEditor.addEventListener("keydown", event => {
        if (event.key === "Tab") {
          event.preventDefault();
          const start = sourceEditor.selectionStart;
          const end = sourceEditor.selectionEnd;
          sourceEditor.setRangeText("  ", start, end, "end");
          markDirty();
        }

        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          saveFile();
        }
      });

      document.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "o") {
          event.preventDefault();
          openHtmlFile();
        }
      });

      window.addEventListener("beforeunload", event => {
        if (!dirty) return;
        event.preventDefault();
        event.returnValue = "";
      });

      window.addEventListener("unload", revokeProjectUrls);

      // Drag-and-drop still supports a standalone HTML file. Use Open Folder for local assets.
      document.addEventListener("dragover", event => {
        if ([...event.dataTransfer.types].includes("Files")) event.preventDefault();
      });

      document.addEventListener("drop", event => {
        const file = event.dataTransfer.files?.[0];
        if (!file || !/\.html?$/i.test(file.name)) return;
        event.preventDefault();
        if (!confirmDiscardUnsaved("open the dropped HTML file")) return;
        openFile(file);
      });

      currentDocumentPath = "untitled.html";
      sourceEditor.value = starterDocument;
      updateSaveButton();
      loadVisual(starterDocument);
      markDirty(false);
    })();
  </script>
</body>
</html>
