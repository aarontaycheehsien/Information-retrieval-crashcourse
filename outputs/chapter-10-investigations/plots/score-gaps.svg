    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #252728" x="504" y="36.384" transform="rotate(-0 504 36.384)">Invented raw-score sets · Different gaps, identical A/B/C order</text>
   </g>
  </g>
  <g id="text_22">
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #252728" x="55.44" y="362.88" transform="rotate(-0 55.44 362.88)">With the same other input list, RRF is identical: A, C, B, D. It never receives these score gaps.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #6e6b63" transform="translate(55.44 379.89125)">Arbitrary teaching scores, not BM25 or embedding measurements. The two score sets are alternative examples, not two new</text>
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #6e6b63" transform="translate(55.44 394.448406)">fusion routes.</text>
  </g>
