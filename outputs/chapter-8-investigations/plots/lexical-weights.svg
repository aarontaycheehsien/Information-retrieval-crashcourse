   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6e6b63" x="55.44" y="338.688" transform="rotate(-0 55.44 338.688)">TF–IDF = raw TF × ln(N/df) · BM25 IDF = ln(1 + (N − df + 0.5)/(df + 0.5))</text>
  </g>
  <g id="text_18">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6e6b63" x="55.44" y="362.88" transform="rotate(-0 55.44 362.88)">BM25 = IDF × f(k₁+1) / [f + k₁(1−b+bL/avgL)] · k₁=1.2, b=0.75</text>
  </g>
